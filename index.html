<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bam's Masterlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #262624;
    --navy-soft: #34322E;
    --ivory: #F9F8F4;
    --ink: #3D3D3A;
    --ink-soft: #87867E;
    --brass: #C1633D;
    --brass-soft: #F1DDCB;
    --line: #E5E2D9;
    --red: #BC4B3C;
    --stripe: #F3F1EA;
    --brass-dark: #A8532E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:var(--ivory);
    color:var(--ink);
    display:flex;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .sidebar{
    width:210px;
    flex-shrink:0;
    background:var(--stripe);
    border-right:1px solid var(--line);
    color:var(--ink);
    padding:28px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    font-family:'Inter', sans-serif;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-0.2px;
    padding:0 4px 22px 4px;
  }
  .brand span{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
    font-weight:400;
    letter-spacing:0;
  }
  .nav-item{
    all:unset;
    cursor:pointer;
    padding:10px 12px;
    border-radius:9px;
    font-size:14.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:background 0.15s ease, color 0.15s ease;
    gap:8px;
  }
  .nav-item:hover{
    background:rgba(0,0,0,0.045);
    color:var(--ink);
  }
  .nav-item.active{
    background:var(--brass);
    color:#fff;
    font-weight:500;
  }
  .nav-item .count{
    font-size:11px;
    color:var(--ink-soft);
    background:rgba(0,0,0,0.05);
    padding:1px 7px;
    border-radius:100px;
    min-width:20px;
    text-align:center;
  }
  .nav-item.active .count{
    color:#fff;
    background:rgba(255,255,255,0.22);
  }

  main{
    flex:1;
    padding:40px 48px;
    max-width:1600px;
    width:100%;
  }
  h1{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:-0.3px;
    margin:0 0 4px 0;
  }
  .sub{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:28px;
  }

  /* --- big box grid --- */
  .box-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .box{
    all:unset;
    cursor:pointer;
    border:1px solid var(--line);
    background:#fff;
    border-radius:16px;
    padding:26px 24px;
    display:flex;
    flex-direction:column;
    gap:18px;
    transition:border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .box:hover{
    border-color:var(--brass);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(38,38,36,0.07);
  }
  .box .box-top{
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
  }
  .box .box-label{
    font-size:16.5px;
    font-weight:600;
    color:var(--ink);
    line-height:1.3;
  }
  .box .box-arrow{
    font-size:18px;
    color:var(--brass);
  }

  /* --- totals summary (shown big, above the client table) --- */
  .totals-summary{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .totals-box{
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    background:#fff;
  }
  .totals-box .tb-label{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:6px;
  }
  .totals-box .tb-value{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--navy);
    letter-spacing:-0.4px;
  }

  /* --- year countdown card (Rewards & Achievements) --- */
  .year-countdown-card{
    border:1px solid var(--brass);
    border-radius:16px;
    padding:22px 26px;
    background:linear-gradient(135deg,#fff,var(--brass-soft) 220%);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
  }
  .year-countdown-card .yc-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--brass-dark);
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .year-countdown-card .yc-value{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:30px;
    color:var(--navy);
    letter-spacing:-0.4px;
    margin:4px 0 2px 0;
  }
  .year-countdown-card .yc-sub{
    font-size:12px;
    color:var(--ink-soft);
  }
  .client-fyp-modal{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(23,35,49,.48);
  }
  .client-fyp-modal.open{display:flex;}
  .client-fyp-dialog{
    width:min(760px,100%);
    max-height:min(720px,90vh);
    overflow:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 24px 70px rgba(23,35,49,.22);
    padding:24px;
  }
  .client-fyp-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px;}
  .client-fyp-head h2{margin:0; color:var(--navy); font-size:21px;}
  .client-fyp-head p{margin:5px 0 0; color:var(--ink-soft); font-size:12.5px;}
  .client-fyp-close{all:unset; cursor:pointer; color:var(--ink-soft); font-size:24px; line-height:1; padding:2px 6px;}
  .client-fyp-close:hover{color:var(--brass);}
  .client-fyp-table{width:100%; border-collapse:collapse; font-size:13px;}
  .client-fyp-table th{background:#f0f4f1; color:var(--navy); text-align:left; font-size:11px; padding:10px;}
  .client-fyp-table td{border-bottom:1px solid var(--line); padding:11px 10px;}
  .client-fyp-table td.num{text-align:right; font-weight:600; color:var(--navy); white-space:nowrap;}
  .client-fyp-empty{color:var(--ink-soft); font-size:13px; padding:8px 0;}
  .lead-name-link{all:unset; cursor:pointer; color:var(--navy); font-weight:700;}
  .lead-name-link:hover{text-decoration:underline; color:var(--brass);}
  .lead-detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 20px;}
  .lead-detail-item{border-bottom:1px solid var(--line); padding-bottom:10px;}
  .lead-detail-item.full{grid-column:1 / -1;}
  .lead-detail-label{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px; font-weight:700;}
  .lead-detail-value{font-size:14px; color:var(--navy); font-weight:600; word-break:break-word;}
  .lead-detail-value.empty{color:var(--ink-soft); font-weight:500;}
  .contact-link{color:var(--brass-dark); font-weight:700; text-decoration:none;}
  .contact-link:hover{text-decoration:underline;}
  .lead-remark{font-size:11px; font-weight:700; color:var(--brass-dark);}
  .move-badge{display:inline-block; border:0; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700; line-height:1; white-space:nowrap;}
  .move-push{background:#dceee4; color:#237044;}
  .move-pull{background:#dce7f5; color:#2b5f96;}
  .push-pull-note{display:none; margin-top:22px; padding:20px 22px; border:1px solid var(--line); border-radius:14px; background:#fff;}
  .push-pull-note.visible{display:block;}
  .push-pull-note h3{margin:0 0 8px; color:var(--navy); font-size:17px;}
  .push-pull-note h4{margin:14px 0 5px; font-size:13px; color:var(--navy);}
  .push-pull-note ul{margin:5px 0 0 18px; padding:0; color:var(--ink-soft); font-size:12.5px; line-height:1.7;}
  .rhythm-table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  .rhythm-table th,.rhythm-table td{padding:9px 8px; border-bottom:1px solid var(--line); text-align:left;}
  .rhythm-table th{color:var(--navy); font-weight:700;}
  .client-metrics{display:grid; gap:12px; margin-bottom:22px;}
  .client-metrics-primary,.client-metrics-secondary{display:grid; gap:12px;}
  .client-metrics-primary{grid-template-columns:repeat(5,minmax(0,1fr));}
  .client-metrics-secondary{grid-template-columns:repeat(6,minmax(0,1fr));}
  .client-metric{min-width:0; border:1px solid var(--line); border-radius:12px; padding:14px 15px; background:#fff;}
  .client-metric.secondary{padding:11px 13px; background:#fbfcfa;}
  .client-metric-label{font-size:10px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.35px; line-height:1.3;}
  .client-metric-value{margin-top:6px; color:var(--navy); font-size:20px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .client-metric.secondary .client-metric-value{font-size:15px; margin-top:4px;}
  @media (max-width:1000px){.client-metrics-primary{grid-template-columns:repeat(3,1fr);}.client-metrics-secondary{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:560px){.client-metrics-primary,.client-metrics-secondary{grid-template-columns:repeat(2,1fr);}}
  .lead-view-tabs{display:flex; gap:8px; margin:0 0 18px;}
  .lead-view-tab{all:unset; cursor:pointer; padding:9px 14px; border:1px solid var(--line); border-radius:8px; color:var(--ink-soft); font-size:12.5px; font-weight:700; background:#fff;}
  .lead-view-tab:hover,.lead-view-tab.active{background:var(--brass); border-color:var(--brass); color:#fff;}
  @media (max-width:480px){
    .client-fyp-dialog{padding:18px;}
    .client-fyp-table{font-size:12px;}
    .client-fyp-table th,.client-fyp-table td{padding:9px 6px;}
  }

  /* --- leaf detail view --- */
  .leaf-view{ display:none; }
  .leaf-view.visible{
    display:block;
    animation:fade 0.2s ease;
  }
  .back-link{
    all:unset;
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:14px;
  }
  .back-link:hover{ color:var(--navy); }

  @keyframes fade{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:12px;
    background:#fff;
  }

  /* entry form (generic sections) */
  .entry-form{
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    background:#fff;
    margin-bottom:22px;
  }
  .entry-form .fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 12px;
    margin-bottom:10px;
  }
  .entry-form .fields .full{
    grid-column:1 / -1;
  }
  label{
    font-size:11.5px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
    font-weight:500;
  }
  input, textarea, select{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--ivory);
    color:var(--ink);
  }
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--brass-soft);
    outline-offset:0;
    border-color:var(--brass);
  }
  textarea{ resize:vertical; min-height:44px; }
  .form-actions{
    display:flex;
    justify-content:flex-end;
  }
  button.primary{
    all:unset;
    cursor:pointer;
    background:var(--brass);
    color:#fff;
    font-size:13px;
    font-weight:600;
    padding:9px 18px;
    border-radius:8px;
    transition:background 0.15s ease;
  }
  button.primary:hover{ background:var(--brass-dark); }

  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .list-head h3{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:14.5px;
    margin:0;
    letter-spacing:-0.1px;
  }
  .clear-link{
    all:unset;
    cursor:pointer;
    font-size:12px;
    color:var(--red);
  }
  .clear-link:hover{ text-decoration:underline; }

  .entry{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding:2px 0;
  }
  .entry .info{ flex:1; }
  .entry .title-line{
    font-size:14px;
    font-weight:500;
    display:flex;
    gap:8px;
    align-items:baseline;
    flex-wrap:wrap;
  }
  .entry .date{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:400;
  }
  .entry .value{
    font-family:'Inter', sans-serif;
    font-weight:600;
    color:var(--navy);
    font-size:13.5px;
  }
  .entry .notes{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
    line-height:1.4;
  }
  .entry .del{
    all:unset;
    cursor:pointer;
    font-size:12px;
    color:var(--ink-soft);
    padding:3px 6px;
  }
  .entry .del:hover{ color:var(--red); }

  .empty{
    color:var(--ink-soft);
    font-size:13.5px;
    padding:6px 0;
  }
  .save-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:-6px;
    margin-bottom:18px;
    min-height:14px;
  }

  /* --- table-style sections (e.g. 2026 Clients) --- */
  .table-scroll{
    border:1px solid var(--line);
    border-radius:12px;
    overflow-x:auto;
    background:#fff;
    margin-bottom:8px;
  }
  table.data-table{
    border-collapse:collapse;
    width:100%;
    min-width:820px;
    font-size:13.5px;
  }
  table.data-table th{
    text-align:left;
    background:var(--stripe);
    color:var(--ink);
    font-size:11.5px;
    font-weight:600;
    padding:11px 12px;
    white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  table.data-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  table.data-table tbody tr:hover{ background:var(--brass-soft); }
  table.data-table td.num{ font-family:'Inter', sans-serif; font-weight:600; color:var(--navy); }
  table.data-table tfoot td{
    font-weight:700;
    font-family:'Inter', sans-serif;
    color:var(--navy);
    border-top:2px solid var(--navy);
    border-bottom:none;
    background:#fff;
  }
  table.data-table .row-del{
    all:unset;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:12px;
  }
  table.data-table .row-del:hover{ color:var(--red); }
  .status-pill{
    display:inline-block;
    font-size:11.5px;
    padding:2px 9px;
    border-radius:100px;
    font-weight:500;
  }
  .status-Issued{ background:#DEEBDD; color:#3A6B44; }
  .status-Lapsed{ background:#DEEBDD; color:#ad2821; }
  .status-Pending{ background:#F6E9CE; color:#8F6A2E; }
  .status-In\ Process{ background:#E1E6F0; color:#3F5480; }
  .status-Declined{ background:#F4DBD5; color:#A54936; }

  .table-form{
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    background:#fff;
    margin-bottom:16px;
  }
  .table-form .fields{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px 12px;
    margin-bottom:12px;
  }
  .table-form .fields .span2{ grid-column:span 2; }

  /* --- today badge (sidebar) --- */
  .today-badge{
    font-size:11px;
    color:var(--ink-soft);
    padding:0 4px 18px 4px;
    margin-top:-8px;
    letter-spacing:0.2px;
  }

  /* --- achievements / travel progress cards --- */
  .rewards-section{ margin-bottom:30px; }
  .rewards-section h2{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:19px;
    margin:0 0 4px 0;
    color:var(--navy);
    letter-spacing:-0.1px;
  }
  .rewards-section .rs-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .achv-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .achv-card{
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 28px;
    background:#fff;
  }
  .achv-card.done{
    border-color:var(--brass);
    background:linear-gradient(0deg,#fff,var(--brass-soft) 180%);
  }
  .achv-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .achv-name{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .achv-pct{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--navy);
    flex-shrink:0;
  }
  .achv-card.done .achv-pct{ color:var(--brass); }
  .achv-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .achv-sub strong{ color:var(--ink); font-weight:600; }
  .progress-track{
    height:11px;
    border-radius:100px;
    background:var(--stripe);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:100px;
    background:var(--navy);
    transition:width 0.3s ease;
  }
  .achv-card.done .progress-fill{ background:var(--brass); }
  .achv-badge{
    display:inline-block;
    font-size:12.5px;
    font-weight:600;
    color:var(--brass-dark);
    background:var(--brass-soft);
    border-radius:100px;
    padding:4px 13px;
    margin-top:12px;
  }
  .togo-line{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .togo-line strong{
    display:block;
    color:var(--brass-dark);
    font-size:18px;
    font-weight:700;
    margin-top:2px;
  }
  .achv-card.done .togo-line strong,
  .travel-card.done .togo-line strong{ color:var(--brass); }
  .travel-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .travel-card{
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 28px;
    background:#fff;
  }
  .travel-card .achv-name{ font-size:17px; }
  .travel-card .loc{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .travel-card .deadline{
    font-size:12.5px;
    color:var(--red);
    margin-top:12px;
    font-weight:500;
  }
  .travel-card .deadline.past{ color:var(--ink-soft); }

  /* --- auth / login screen --- */
  #auth-loading{
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ivory);
    color:var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size:13.5px;
  }
  #login-screen{
    min-height:100vh;
    width:100%;
    display:none;
    align-items:center;
    justify-content:center;
    background:var(--ivory);
  }
  .login-box{
    width:100%;
    max-width:360px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px 28px;
    box-shadow:0 8px 24px rgba(38,38,36,0.05);
  }
  .login-box .brand{
    padding:0 0 22px 0;
    color:var(--navy);
  }
  .login-box .brand span{ color:var(--ink-soft); }
  .login-box label{ margin-top:12px; }
  .login-box label:first-of-type{ margin-top:0; }
  .login-error{
    font-size:12.5px;
    color:var(--red);
    min-height:16px;
    margin-top:10px;
  }
  .login-box button.primary{
    width:100%;
    text-align:center;
    margin-top:16px;
    padding:10px 16px;
  }
  #app-shell{ display:none; }
  .signout-link{
    all:unset;
    cursor:pointer;
    font-size:12px;

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
    setPersistence, browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC9VjcOcgGLhKc65mRC0w9O-lPMzkuQhMM",
    authDomain: "zethmasterlist.firebaseapp.com",
    projectId: "zethmasterlist",
    storageBucket: "zethmasterlist.firebasestorage.app",
    messagingSenderId: "807721959686",
    appId: "1:807721959686:web:36ab34d2be9c17836f5e87",
    measurementId: "G-P7RRV8PQ6C"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let hasInitedApp = false;

  // Session persistence: signed-in state survives a page refresh (it lives
  // in sessionStorage for this tab) but is cleared as soon as the tab or
  // window is closed, so closing and reopening always asks for sign-in
  // again. Set this before anything else touches auth.
  const authReady = setPersistence(auth, browserSessionPersistence).catch(e => {
    console.error('setPersistence failed', e);
  });

  /* each dashboard "id" (e.g. pru-clients) is stored as one Firestore
     document at users/{uid}/entries/{id}, holding { value: [...] } */
  window.fbGetEntries = async function(id){
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return [];
    try{
      const snap = await getDoc(doc(db, "users", uid, "entries", id));
      if(!snap.exists()) return [];
      return snap.data().value || [];
    }catch(e){
      console.error("fbGetEntries failed", e);
      window.lastFbError = e.code || e.message;
      return [];
    }
  };
  window.fbSaveEntries = async function(id, entries){
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return false;
    try{
      await setDoc(doc(db, "users", uid, "entries", id), { value: entries });
      window.lastFbError = null;
      return true;
    }catch(e){
      console.error("fbSaveEntries failed", e);
      window.lastFbError = e.code || e.message;
      return false;
    }
  };

  const authLoading = document.getElementById('auth-loading');
  const loginScreen = document.getElementById('login-screen');
  const appShell = document.getElementById('app-shell');
  const loginError = document.getElementById('login-error');
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');

  const ERROR_MESSAGES = {
    'auth/invalid-credential': 'Wrong email or password.',
    'auth/wrong-password': 'Wrong password.',
    'auth/user-not-found': 'No account found for that email.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/too-many-requests': 'Too many attempts — wait a bit and try again.',
    'auth/network-request-failed': 'Network error — check your connection.',
  };
  async function doSignIn(){
    loginError.textContent = '';
    const email = emailEl.value.trim();
    const password = passwordEl.value;
    if(!email || !password){
      loginError.textContent = 'Enter your email and password.';
      return;
    }
    try{
      await authReady;
      await signInWithEmailAndPassword(auth, email, password);
    }catch(e){
      console.error('Firebase sign-in error:', e.code, e.message);
      loginError.textContent = ERROR_MESSAGES[e.code] || ('Sign-in failed (' + (e.code || 'unknown error') + ').');
    }
  }
  document.getElementById('login-submit').addEventListener('click', doSignIn);
  document.getElementById('login-show-pw').addEventListener('change', (e) => {
    passwordEl.type = e.target.checked ? 'text' : 'password';
  });
  passwordEl.addEventListener('keydown', e => { if(e.key === 'Enter') doSignIn(); });
  emailEl.addEventListener('keydown', e => { if(e.key === 'Enter') doSignIn(); });
  document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    authLoading.style.display = 'none';
    if(user){
      loginScreen.style.display = 'none';
      appShell.style.display = 'flex';
      const userLabel = document.getElementById('sidebar-user');
      if(userLabel) userLabel.textContent = user.email || '';
      if(!hasInitedApp){
        hasInitedApp = true;
        if(window.initApp) window.initApp();
      }
    }else{
      appShell.style.display = 'none';
      loginScreen.style.display = 'flex';
      passwordEl.value = '';
    }
  });
</script>

const LEAD_SOURCES = ["FB","IG","Tiktok","FB Ads","Referral","B2B/Flyering"];

/* -- rolling-12-month FYP: paid premium installments inside the 12 calendar
  months ending today -- */
function submittedDateFromMonth(value, year){
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))){
    return new Date(value + 'T00:00:00');
  }
  const idx = MONTHS.indexOf(value);
  if(idx === -1) return null;
  return new Date(year, idx, 1);
}
function isIssuedIn2026(row){
  const issuedDate = submittedDateFromMonth(row.submitted, 2026);
  return issuedDate && issuedDate.getFullYear() === 2026;
}
function computeFYP(row, asOfDate){
  const premium = parseCurrency(row.premium);
  const freq = MODE_FREQ[row.mode];
  if(!premium || !freq || !row.submitted) return 0;
  const submittedDate = submittedDateFromMonth(row.submitted, 2026);
  if(!submittedDate) return 0;
  const endDate = asOfDate || new Date();
  const endMonth = endDate.getFullYear() * 12 + endDate.getMonth();
  const windowStartMonth = endMonth - 12;
  const submittedMonth = submittedDate.getFullYear() * 12 + submittedDate.getMonth();
  const periodMonths = 12 / freq;
  if(submittedMonth < windowStartMonth || submittedMonth > endMonth) return 0;
  const firstIncludedPayment = submittedMonth;
  const paymentsInWindow = firstIncludedPayment > endMonth
    ? 0
    : Math.min(freq, Math.floor((endMonth - firstIncludedPayment) / periodMonths) + 1);
  return paymentsInWindow * premium;
}

function clientFYP(row, asOfDate){
  if(row.status && row.status !== 'Issued') return 0;
  return computeFYP(row, asOfDate);
}

/* ---------- storage helpers ----------
   Backed by Firestore (see the type="module" script above), scoped to the
   signed-in user's account, so data syncs across any browser or device you
   log into.

   entriesCache holds every section's data in memory once it's been fetched.
   primeCache() fetches ALL sections in one parallel batch on load (instead of
   one Firestore round trip per section, done one after another) — this is
   what used to make the dashboard take up to a minute to open. Everything
   below reads from the cache and only re-hits Firestore when data changes. */
const entriesCache = {};
function allLeafIds(){
  const ids = [];
  GROUPS.forEach(g => g.items.forEach(item => { if(!item.url) ids.push(item.id); }));
  return ids;
}
async function primeCache(){
  const ids = allLeafIds();
  const results = await Promise.all(ids.map(id => window.fbGetEntries(id)));
  ids.forEach((id, i) => { entriesCache[id] = results[i]; });
}
async function getEntries(id){
  if(entriesCache[id]) return entriesCache[id];
  const entries = await window.fbGetEntries(id);
  entriesCache[id] = entries;
  return entries;
}
async function saveEntries(id, entries){
  const ok = await window.fbSaveEntries(id, entries);
  if(ok) entriesCache[id] = entries;
  return ok;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
function fmtIssuedDate(value){
  const date = submittedDateFromMonth(value, 2026);
  return date ? date.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : value;
}
function dateInputValue(value){
  const date = submittedDateFromMonth(value, 2026);
  if(!date) return '';
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}
function parseCurrency(s){
  if(!s) return 0;
  const n = parseFloat(String(s).replace(/[₱,\s]/g, ''));
  return isNaN(n) ? 0 : n;
}
function fmtCurrency(n){
  return '₱' + (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function contactHref(value){
  return /^https?:\/\//i.test(String(value || '')) ? String(value) : '';
}

function progressPct(current, threshold){
  if(!threshold) return 0;
  return Math.max(0, Math.min(100, (current / threshold) * 100));
}

function togoLine(remaining, done, doneLabel){
  return done
    ? `<div class="togo-line">To-Go<strong>${doneLabel || 'Achieved 🎉'}</strong></div>`
    : `<div class="togo-line">To-Go<strong>${fmtCurrency(remaining)}</strong></div>`;
}

async function renderRewardsPanel(){
  const mount = document.getElementById('rewards-mount');
  if(!mount) return; // panel not built yet
  const clients = await getEntries('pru-clients');
  const issued = clients.filter(r => r.status === 'Issued');
  const fypAsOfDate = new Date();

  // Achievement Ladder runs on Issued APE except MDRT, which uses paid FYP.
  const achievementClients = issued.filter(isIssuedIn2026);
  const totalAPE = achievementClients.reduce((sum, r) => sum + parseCurrency(r.ape), 0);

  // South Korea Travel only counts APE from clients Issued Aug–Nov 2026.
  const skoreaAPE = issued
    .filter(r => {
      const issuedDate = submittedDateFromMonth(r.submitted, 2026);
      return isIssuedIn2026(r) && issuedDate && SKOREA_WINDOW_MONTHS.includes(MONTHS[issuedDate.getMonth()]);
    })
    .reduce((sum, r) => sum + parseCurrency(r.ape), 0);

  // MDRT Annual/Global meetings qualify on FYP, not APE.
  const totalFYP = issued.reduce((sum, r) => sum + clientFYP(r, fypAsOfDate), 0);

  const achvCards = ACHIEVEMENTS.map(a => {
    const usesFyp = a.basis === 'fyp';
    const value = usesFyp ? totalFYP : totalAPE;
    const unit = usesFyp ? 'FYP' : 'APE';
    const pct = progressPct(value, a.threshold);
    const done = pct >= 100;
    const remaining = Math.max(0, a.threshold - value);
    return `
      <div class="achv-card reward-clickable ${done ? 'done' : ''}" role="button" tabindex="0" onclick="openRewardBreakdown('achievement','${a.key}')" onkeydown="if(event.key === 'Enter' || event.key === ' ') openRewardBreakdown('achievement','${a.key}')">
        <div class="achv-top">
          <div class="achv-name">${a.label}</div>
          <div class="achv-pct">${pct.toFixed(0)}%</div>
        </div>
        <div class="achv-sub"><strong>${fmtCurrency(value)}</strong> of ${fmtCurrency(a.threshold)} ${unit}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${done ? `<div class="achv-badge">Achieved</div>` : ''}
        ${togoLine(remaining, done)}
      </div>`;
  }).join('');

  const today = new Date();
  const travelCards = TRAVEL_INCENTIVES.map(t => {
    const value = t.key === 'skorea' ? skoreaAPE : totalAPE;
    const pct = progressPct(value, t.threshold);
    const done = pct >= 100;
    const remaining = Math.max(0, t.threshold - value);
    const deadline = new Date(t.deadline + 'T00:00:00');
    const msLeft = deadline - today;
    const daysLeft = Math.ceil(msLeft / 86400000);
    const deadlineLabel = daysLeft >= 0
      ? `${daysLeft} day${daysLeft === 1 ? '' : 's'} left · until ${fmtDate(t.deadline)}`
      : `Window closed ${fmtDate(t.deadline)}`;
    return `
      <div class="travel-card reward-clickable ${done ? 'achv-card done' : ''}" role="button" tabindex="0" onclick="openRewardBreakdown('travel','${t.key}')" onkeydown="if(event.key === 'Enter' || event.key === ' ') openRewardBreakdown('travel','${t.key}')">
        <div class="achv-top">
          <div class="achv-name">${t.label}</div>
          <div class="achv-pct">${pct.toFixed(0)}%</div>
        </div>
        ${t.windowLabel ? `<div class="loc">${t.windowLabel}</div>` : ''}
        <div class="achv-sub"><strong>${fmtCurrency(value)}</strong> of ${fmtCurrency(t.threshold)} APE</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${done ? `<div class="achv-badge">Qualified</div>` : ''}
        ${togoLine(remaining, done)}
        <div class="deadline ${daysLeft < 0 ? 'past' : ''}">${deadlineLabel}</div>
      </div>`;
  }).join('');

  const mdrtPct = progressPct(totalFYP, MDRT_THRESHOLD);
  const mdrtDone = mdrtPct >= 100;
  const mdrtRemaining = Math.max(0, MDRT_THRESHOLD - totalFYP);
  const mdrtCards = MDRT_MEETINGS.map(m => `
    <div class="travel-card reward-clickable ${mdrtDone ? 'achv-card done' : ''}" role="button" tabindex="0" onclick="openRewardBreakdown('mdrt','${m.key}')" onkeydown="if(event.key === 'Enter' || event.key === ' ') openRewardBreakdown('mdrt','${m.key}')">
      <div class="achv-top">
        <div class="achv-name">${m.label}</div>
        <div class="achv-pct">${mdrtPct.toFixed(0)}%</div>
      </div>
      <div class="loc">${m.loc}</div>
      <div class="achv-sub"><strong>${fmtCurrency(totalFYP)}</strong> of ${fmtCurrency(MDRT_THRESHOLD)} FYP from Issued 2026 Clients · rolling 12 months ending today</div>
      <div class="progress-track"><div class="progress-fill" style="width:${mdrtPct}%"></div></div>
      ${mdrtDone ? `<div class="achv-badge">Qualified</div>` : ''}
      ${togoLine(mdrtRemaining, mdrtDone)}
    </div>`).join('');

  mount.innerHTML = `
    <div class="rewards-section">
      <div class="year-countdown-card">
        <div class="yc-label">Time left in 2026</div>
        <div class="yc-value" id="year-countdown-value">—</div>
        <div class="yc-sub">Countdown to Jan 1, 2027</div>
      </div>
    </div>
    <div class="rewards-section">
      <h2>Achievement Ladder</h2>
      <div class="rs-sub">Based on total Issued APE across your 2026 Clients: <strong>${fmtCurrency(totalAPE)}</strong></div>
      <div class="achv-grid">${achvCards}</div>
    </div>
    <div class="rewards-section">
      <h2>Travel Incentives</h2>
      <div class="rs-sub">South Korea Travel counts Issued APE from Aug–Nov 2026 only · MDRT meetings qualify on FYP</div>
      <div class="travel-grid">${travelCards}${mdrtCards}</div>
    </div>
  `;
  startYearCountdown();
}

async function openRewardBreakdown(kind, key){
  const modal = document.getElementById('client-fyp-modal');
  const list = document.getElementById('client-fyp-list');
  if(!modal || !list) return;
  const clients = await getEntries('pru-clients');
  const issued = clients.filter(row => row.status === 'Issued');
  const reward = [...ACHIEVEMENTS, ...TRAVEL_INCENTIVES, ...MDRT_MEETINGS].find(item => item.key === key);
  const isFyp = kind === 'mdrt' || key === 'mdrt';
  const fypAsOfDate = new Date();
  const qualifying = issued
    .filter(row => {
      if(isFyp) return clientFYP(row, fypAsOfDate) > 0;
      const issuedDate = submittedDateFromMonth(row.submitted, 2026);
      if(!isIssuedIn2026(row)) return false;
      return key === 'skorea'
        ? issuedDate && SKOREA_WINDOW_MONTHS.includes(MONTHS[issuedDate.getMonth()])
        : true;
    })
    .sort((a, b) => {
      const aDate = submittedDateFromMonth(a.submitted, 2026);
      const bDate = submittedDateFromMonth(b.submitted, 2026);
      return (aDate ? aDate.getTime() : 0) - (bDate ? bDate.getTime() : 0);
    });
  const title = reward ? reward.label : 'Reward Breakdown';
  const basis = isFyp ? 'FYP' : 'APE';
  list.innerHTML = qualifying.length
    ? `<table class="client-fyp-table">
        <thead><tr><th>Client Name</th><th>Issued Date</th><th>APE</th><th>FYP</th><th>Counted ${basis}</th></tr></thead>
        <tbody>${qualifying.map(row => `
          <tr>
            <td>${escapeHtml(row.name || 'Unnamed client')}</td>
            <td>${escapeHtml(fmtIssuedDate(row.submitted || ''))}</td>
            <td class="num">${fmtCurrency(parseCurrency(row.ape))}</td>
            <td class="num">${fmtCurrency(clientFYP(row, fypAsOfDate))}</td>
            <td class="num">${fmtCurrency(isFyp ? clientFYP(row, fypAsOfDate) : parseCurrency(row.ape))}</td>
          </tr>`).join('')}</tbody>
      </table>`
    : '<div class="client-fyp-empty">No Issued 2026 Clients count toward this reward yet.</div>';
  document.getElementById('client-fyp-title').textContent = title + ' · Client Breakdown';
  document.querySelector('#client-fyp-modal .client-fyp-head p').textContent = `Clients counted by ${basis} for this reward.`;
  modal.classList.add('open');
}

function closeClientFypModal(){

}

/* -- live countdown to Jan 1, 2027, shown at the top of Rewards & Achievements -- */
let yearCountdownTimer = null;
function startYearCountdown(){
  if(yearCountdownTimer) clearInterval(yearCountdownTimer);
  function tick(){
    const el = document.getElementById('year-countdown-value');
    if(!el){ clearInterval(yearCountdownTimer); yearCountdownTimer = null; return; }
    const target = new Date(2027, 0, 1, 0, 0, 0);
    const diff = Math.max(0, target - new Date());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    el.textContent = `${days}d ${String(hours).padStart(2,'0')}h ${String(minutes).padStart(2,'0')}m ${String(seconds).padStart(2,'0')}s`;
  }
  tick();
  yearCountdownTimer = setInterval(tick, 1000);
}

/* -- Premium × Mode of Payment → APE, live in the add/edit client form --
   Annual×1, Semi-Annual×2, Quarterly×4, Monthly×12 (reuses MODE_FREQ). */
function setupApeAutoCalc(item, config){
  const hasKeys = ['premium','mode','ape'].every(k => config.columns.some(c => c.key === k));
  if(!hasKeys) return;
  const premiumEl = document.getElementById(item.id + '-f-premium');
  const modeEl = document.getElementById(item.id + '-f-mode');
  const apeEl = document.getElementById(item.id + '-f-ape');
  if(!premiumEl || !modeEl || !apeEl) return;
  function recalc(){
    const premium = parseCurrency(premiumEl.value);
    const freq = MODE_FREQ[modeEl.value];
    if(premium && freq) apeEl.value = (premium * freq).toFixed(2);
  }
  premiumEl.addEventListener('input', recalc);
  modeEl.addEventListener('change', recalc);
}

GROUPS.forEach(g => {

    }else{

    }

    if(tableConfig) setupApeAutoCalc(item, tableConfig);

});

async function renderStatisticsPanel(){
  if(!statisticsMount) return;
  const clients = await getEntries('pru-clients');
  const today = new Date();
  const currentYear = today.getFullYear();
  const months = [...MONTHS];
  const rows = clients.filter(row => !row.status || String(row.status).toLowerCase() === 'issued').map(row => ({
    ...row,
    statsDate: submittedDateFromMonth(row.submitted, currentYear),
  })).filter(row => row.statsDate);
  const own = rows.filter(row => (row.clientType || 'Own') === 'Own');
  const adopted = rows.filter(row => (row.clientType || 'Own') === 'Adopted');
  const ownYtd = own.filter(row => row.statsDate.getFullYear() === currentYear && row.statsDate <= today);
  const average = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
  const totalApe = list => list.reduce((sum, row) => sum + parseCurrency(row.ape), 0);
  const planRows = list => {
    const grouped = {};
    list.forEach(row => {
      const plan = row.plan || 'Unspecified';
      if(!grouped[plan]) grouped[plan] = { plan, clients:0, ape:0 };
      grouped[plan].clients += 1;
      grouped[plan].ape += parseCurrency(row.ape);
    });
    return Object.values(grouped).sort((a, b) => b.ape - a.ape);
  };
  const monthly = months.map((month, index) => {
    const monthRows = ownYtd.filter(row => row.statsDate.getMonth() === index);
    return { month, clients: monthRows.length, ape: totalApe(monthRows) };
  });
  const activeMonths = monthly.filter(row => row.clients > 0);
  const yearly = {};
  own.forEach(row => {
    const year = row.statsDate.getFullYear();
    if(!yearly[year]) yearly[year] = { year, clients:0, ape:0 };
    yearly[year].clients += 1;
    yearly[year].ape += parseCurrency(row.ape);
  });
  const yearlyRows = Object.values(yearly).sort((a, b) => b.year - a.year);
  const yearlyByYear = Object.fromEntries(yearlyRows.map(row => [row.year, row]));
  yearlyRows.forEach(row => {
    const previous = yearlyByYear[row.year - 1];
    row.growth = previous && previous.ape > 0 ? ((row.ape - previous.ape) / previous.ape) * 100 : null;
  });
  const chartBars = (list, labelKey, valueKey, formatter) => {
    if(!list.length) return '<div class="statistics-empty">No data to chart.</div>';
    const maximum = Math.max(...list.map(row => row[valueKey]), 1);
    return `<div class="statistics-bar-list">${list.map(row => `<div class="statistics-bar-row"><div class="statistics-bar-label">${escapeHtml(row[labelKey])}</div><div class="statistics-bar-track"><div class="statistics-bar-fill" style="width:${(row[valueKey] / maximum) * 100}%"></div></div><div class="statistics-bar-value">${formatter(row[valueKey])}</div></div>`).join('')}</div>`;
  };
  const ownApe = totalApe(own);
  const adoptedApe = totalApe(adopted);
  const combinedApe = ownApe + adoptedApe;
  const ownShare = combinedApe ? (ownApe / combinedApe) * 360 : 0;
  const rewardApeRows = rows.filter(row => row.statsDate.getFullYear() === 2026);
  const rewardApe = totalApe(rewardApeRows);
  const rewardLadder = ACHIEVEMENTS.filter(item => item.basis !== 'fyp').sort((a, b) => a.threshold - b.threshold);
  const achievedRewards = rewardLadder.filter(item => rewardApe >= item.threshold);
  const nextReward = rewardLadder.find(item => rewardApe < item.threshold);
  const highestReward = achievedRewards[achievedRewards.length - 1];
  const travelDeadline = TRAVEL_INCENTIVES[0]?.deadline || '2026-11-30';
  const travelDeadlineLabel = new Date(travelDeadline + 'T00:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  const mdrtDeadlineLabel = 'December 31, 2026';
  const assessment = nextReward
    ? `Your 2026 issued production is ${fmtCurrency(rewardApe)} APE. You have reached ${highestReward ? highestReward.label : 'the starting line'} and are ${fmtCurrency(Math.max(0, nextReward.threshold - rewardApe))} away from ${nextReward.label}. Do not wait for motivation: schedule the next conversations, follow up daily, and track issued Own production every week.`
    : `Your 2026 issued production is ${fmtCurrency(rewardApe)} APE, beyond the ${highestReward.label} milestone. Sustain the pace, protect your quality standard, and keep building toward the FYP-based MDRT goal.`;
  const assessmentNotes = `Strict notes: South Korea production is counted only from August through November and the travel deadline is ${travelDeadlineLabel}. MDRT qualification is FYP-based and must be secured by ${mdrtDeadlineLabel}. A goal without weekly issued production, follow-ups, and documented next actions is only a wish.`;
  statisticsMount.innerHTML = `
    <button class="statistics-back" onclick="closeStatistics()">← Back to dashboard</button>
    <h1>Statistics</h1>
    <div class="sub">Issued client production, plan mix, and own-client performance.</div>
    <h2>Statistics for Own &amp; Adopted</h2>
    <div class="stats-sub">Issued clients only. Lapsed clients are excluded.</div>
    <div class="statistics-grid">
      <div class="statistics-card"><h3>Own</h3><div class="statistics-values"><div><div class="statistics-label">Clients</div><div class="statistics-value">${own.length}</div></div><div><div class="statistics-label">APE</div><div class="statistics-value">${fmtCurrency(totalApe(own))}</div></div><div><div class="statistics-label">Avg APE</div><div class="statistics-value">${fmtCurrency(average(own.map(row => parseCurrency(row.ape))))}</div></div></div></div>
      <div class="statistics-card"><h3>Adopted</h3><div class="statistics-values"><div><div class="statistics-label">Clients</div><div class="statistics-value">${adopted.length}</div></div><div><div class="statistics-label">APE</div><div class="statistics-value">${fmtCurrency(totalApe(adopted))}</div></div><div><div class="statistics-label">Avg APE</div><div class="statistics-value">${fmtCurrency(average(adopted.map(row => parseCurrency(row.ape))))}</div></div></div></div>

/* ---------- view switching ---------- */
function renderView(){
  if(statisticsOpen){
    boxGrid.style.display = 'none';
    document.getElementById('group-title').style.display = 'none';
    document.getElementById('group-sub').style.display = 'none';
    document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
    statisticsMount.classList.add('visible');
    return;
  }
  statisticsMount.classList.remove('visible');
  const showGrid = activeLeaf === null;
  boxGrid.style.display = showGrid ? 'grid' : 'none';
  document.getElementById('group-title').style.display = showGrid ? 'block' : 'none';
  document.getElementById('group-sub').style.display = showGrid ? 'block' : 'none';
  document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
  if(!showGrid){
    document.getElementById('leaf-' + activeLeaf).classList.add('visible');
  }
}

/* ---------- rendering: generic list ---------- */
async function renderList(id){
  if(id === 'pru-servicing') return renderServicingTable(id);
  if(TABLE_LEAVES[id] && TABLE_LEAVES[id].lead){
    return renderLeadTable(id);
  }
  if(TABLE_LEAVES[id]){
    return renderTable(id);
  }
  const entries = await getEntries(id);
  const listEl = document.getElementById(id + '-list');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;

  if(entries.length === 0){
    listEl.innerHTML = `<div class="empty">No entries yet — add your first one above.</div>`;
  }else{
    const sorted = [...entries].sort((a,b) => (b.ts||0) - (a.ts||0));

      const idx = entries.indexOf(e);
      return `
      <div class="card entry">

function buildSortOptions(config, id){
  const opts = ['<option value="date-asc">Issued date</option>'];
  if(config.columns.some(c => c.key === 'name')) opts.push('<option value="name-asc">Name (A\u2013Z)</option>');
  if(config.columns.some(c => c.key === 'submitted')) opts.push('<option value="date-asc">Issued date</option>');
  if(id === 'pru-clients'){
    opts.push('<option value="status-issued">Issued only</option>');
    opts.push('<option value="status-lapsed">Lapsed only</option>');
  }else if(config.columns.some(c => c.key === 'status')){
    opts.push('<option value="status-asc">By Status</option>');
  }
  if(config.columns.some(c => c.key === 'plan')) opts.push('<option value="plan-asc">By Plan</option>');
  if(config.columns.some(c => c.key === 'mode')) opts.push('<option value="mode-asc">By Mode</option>');

const leadSortState = {};

  leadViewState[id] = view;

function leadDateValue(row){
  return row.contactStarted ? new Date(row.contactStarted + 'T00:00:00') : row.dateAdded ? new Date(row.dateAdded) : new Date(row.ts || 0);
}
function leadDateLabel(row){
  const date = leadDateValue(row);
  return date.getTime() ? date.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : '';
}
function leadDaysSince(row){
  const date = leadDateValue(row);
  if(!date.getTime()) return '';
  return Math.max(0, Math.floor((Date.now() - date.getTime()) / 86400000));
}
function leadRemark(status){
  return status === 'App Submitted' || status === 'Issued' ? 'Nurture Client' : 'Followup';
}
function nextLeadMove(lastMove){
  if(lastMove === 'Push') return 'Pull';
  if(lastMove === 'Pull') return 'Push';
  return '';
}
function nurtureFocus(days){
  if(days <= 1) return { move:'Push', text:'Start & discover' };
  if(days === 2) return { move:'Pull', text:'Give space' };
  if(days === 3) return { move:'Push', text:'Educate' };
  if(days === 4) return { move:'Pull', text:'' };
  if(days === 5) return { move:'Push', text:'Invite to assessment' };
  if(days === 6) return { move:'Pull', text:'' };
  if(days === 7) return { move:'Push', text:'Give value' };
  if(days === 8) return { move:'Pull', text:'' };
  if(days <= 10) return { move:'Push', text:'Build trust + recommend' };
  if(days === 11) return { move:'Pull', text:'Let them think' };
  if(days === 12) return { move:'Push', text:'Ask for decision' };
  if(days === 13) return { move:'Pull', text:'Remove pressure' };
  return { move:'Both', text:'Close the loop' };
}
function nurtureFocusHtml(row){
  const focus = nurtureFocus(leadDaysSince(row));
  if(focus.move === 'Both') return `<span class="move-badge move-push">PUSH</span><span class="move-badge move-pull">PULL</span> — ${focus.text}`;
  return `${moveBadge(focus.move)}${focus.text ? ` — ${focus.text}` : ''}`;
}
function moveBadge(move){
  if(!move) return '<span class="lead-detail-value empty">Not set</span>';
  const className = move.toLowerCase() === 'push' ? 'move-push' : 'move-pull';
  return `<span class="move-badge ${className}">${move}</span>`;
}
function needsNurture(row){
  const days = leadDaysSince(row);
  return days !== '' && days >= 0 && days <= 14;
}
function needsLongTermNurture(row){
  const days = leadDaysSince(row);
  return days !== '' && days >= 15;
}
function setLeadSort(id, value){

  renderLeadTable(id);
}
async function renderLeadTable(id){
  const entries = await getEntries(id);
  document.getElementById(id + '-push-pull-note')?.classList.toggle('visible', leadViewState[id] === 'nurture');

    ? entries.filter(needsNurture)
    : leadViewState[id] === 'longterm'
      ? entries.filter(needsLongTermNurture)
      : entries;
  const query = searchState[id] || '';
  const visibleEntries = query
    ? viewEntries.filter(row => Object.values(row).some(value => String(value ?? '').toLowerCase().includes(query)))

    if(sortMode === 'name-asc') return (a.name || '').localeCompare(b.name || '');
    if(sortMode === 'source-asc') return (a.source || '').localeCompare(b.source || '');
    if(sortMode === 'status-asc') return (a.status || '').localeCompare(b.status || '');

  });

    </tr></thead><tbody>${sorted.map(row => {
      const idx = entries.indexOf(row);
      return `<tr><td>${leadDateLabel(row)}</td><td>${leadDaysSince(row)}</td><td><button class="lead-name-link" onclick="openLeadDetails('${id}', ${idx})">${escapeHtml(row.name || 'Unnamed lead')}</button></td><td>${escapeHtml(row.source || '')}</td><td class="num">${fmtCurrency(parseCurrency(row.ape))}</td><td><span class="status-pill status-${(row.status || '').replace(' ','\\ ')}">${escapeHtml(row.status || '')}</span></td>${leadViewState[id] === 'nurture' ? `<td>${nurtureFocusHtml(row)}</td>` : ''}<td>${moveBadge(nextLeadMove(row.lastMove))}</td><td class="lead-remark">${leadRemark(row.status)}</td><td><button class="row-del" onclick="editLeadRow('${id}', ${idx})">Edit</button>&nbsp;&nbsp;<button class="row-del" onclick="duplicateLeadRow('${id}', ${idx})">Duplicate</button>&nbsp;&nbsp;<button class="row-del" onclick="deleteEntry('${id}', ${idx})">Remove</button></td></tr>`;
    }).join('')}</tbody></table></div>` : '<div class="empty">No leads yet — add your first lead above.</div>';

async function renderServicingTable(id){
  const entries = await getEntries(id);
  const view = servicingViewState[id] || 'all';
  const viewEntries = view === 'all' ? entries : entries.filter(row => (row.servicingType || 'Own') === view);
  const sortMode = servicingSortState[id] || 'date-asc';
  const statusFiltered = sortMode === 'status-issued'
    ? viewEntries.filter(row => !row.status || String(row.status).toLowerCase() === 'issued')
    : sortMode === 'status-lapsed'
      ? viewEntries.filter(row => String(row.status || '').toLowerCase() === 'lapsed')
      : viewEntries;
  const query = searchState[id] || '';
  const visible = (query
    ? statusFiltered.filter(row => Object.values(row).some(value => String(value ?? '').toLowerCase().includes(query)))
    : statusFiltered).sort((a, b) => {
      if(sortMode === 'name-asc') return (a.name || '').localeCompare(b.name || '');
      return (a.issuedDate || a.submitted || '').localeCompare(b.issuedDate || b.submitted || '');
    });
  const listEl = document.getElementById(id + '-list');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;
  const sortSelect = document.getElementById(id + '-sort');
  if(sortSelect) sortSelect.value = sortMode;
  listEl.innerHTML = visible.length ? `<div class="table-scroll"><table class="data-table"><thead><tr><th>Client Name</th><th>Issued Date</th><th>Type</th><th>Plan</th><th>Mode</th><th>Status</th><th>Contact Link</th><th>Notes</th><th></th></tr></thead><tbody>${visible.map(row => {
    const idx = entries.indexOf(row);
    return `<tr><td>${escapeHtml(row.name || '')}</td><td>${escapeHtml(fmtIssuedDate(row.issuedDate || row.submitted || ''))}</td><td>${escapeHtml(row.servicingType || 'Own')}</td><td>${escapeHtml(row.plan || '')}</td><td>${escapeHtml(row.mode || '')}</td><td><span class="status-pill status-${(row.status || 'Issued').replace(' ','\\ ')}">${escapeHtml(row.status || 'Issued')}</span></td><td>${contactHref(row.contactLink) ? `<a class="contact-link" href="${escapeHtml(contactHref(row.contactLink))}" target="_blank" rel="noopener">Open Link</a>` : ''}</td><td>${escapeHtml(row.notes || '')}</td><td><button class="row-del" onclick="editServicingEntry('${id}', ${idx})">Edit</button>&nbsp;&nbsp;<button class="row-del" onclick="deleteEntry('${id}', ${idx})">Remove</button></td></tr>`;
  }).join('')}</tbody></table></div>` : '<div class="empty">No clients in this view yet.</div>';
  await renderGroupCount(idToGroup(id));
}
function setServicingSort(id, value){
  servicingSortState[id] = value;
  renderServicingTable(id);
}
async function addServicingEntry(id){
  const entries = await getEntries(id);
  const editing = editState[id];
  const row = {
    name: document.getElementById(id + '-f-name').value.trim(),
    issuedDate: document.getElementById(id + '-f-issuedDate').value,

    clearEditMode(id, 'Add client');
  }

}

function leadFieldValue(id, col){

function setLeadFieldValue(id, col, value){

  if(!field) return;

    const values = Array.isArray(value) ? value : [];
    [...field.options].forEach(option => { option.selected = values.includes(option.value); });

async function addLeadRow(id){
  const config = TABLE_LEAVES[id];
  const noteEl = document.getElementById(id + '-savenote');
  const row = {};
  config.columns.forEach(col => { row[col.key] = leadFieldValue(id, col); });
  if(!row.name){ noteEl.textContent = 'Add the lead name first.'; noteEl.style.color = 'var(--red)'; return; }
  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]) entries[editing] = { ...entries[editing], ...row };
  else { row.ts = Date.now(); row.dateAdded = new Date().toISOString(); entries.push(row); }
  const ok = await saveEntries(id, entries);
  if(ok){
    config.columns.forEach(col => setLeadFieldValue(id, col, ''));
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    if(editing != null) clearEditMode(id, 'Add lead');
  }else{ noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'); noteEl.style.color = 'var(--red)'; }
  if(ok && row.status === 'Issued') await moveIssuedLeadToServicing(editing != null ? entries[editing] : row);
  await refreshAfterClientChange(id);
}
async function moveIssuedLeadToServicing(lead){
  const servicing = await getEntries('pru-servicing');
  const sourceKey = lead.ts || `${lead.name}|${lead.contactStarted || ''}`;
  if(servicing.some(client => client.sourceLeadKey === sourceKey)) return;
  servicing.push({
    ...lead,
    name: lead.name,
    issuedDate: lead.contactStarted || new Date().toISOString().slice(0, 10),
    servicingType: 'Own',
    status: 'Issued',
    notes: `Moved from Pru Leads${lead.lastContact ? ` · Last contact ${lead.lastContact}` : ''}`,
    sourceLeadKey: sourceKey,
    ts: Date.now()
  });
  await saveEntries('pru-servicing', servicing);
  const leads = await getEntries('pru-leads');
  const index = leads.findIndex(item => (item.ts || `${item.name}|${item.contactStarted || ''}`) === sourceKey);
  if(index >= 0){ leads.splice(index, 1); await saveEntries('pru-leads', leads); }
}
async function migrateExistingIssuedLeads(){
  const leads = await getEntries('pru-leads');
  const issued = leads.filter(row => row.status === 'Issued');
  for(const lead of issued) await moveIssuedLeadToServicing(lead);
}
async function syncClientsToServicing(){
  const clients = await getEntries('pru-clients');
  const servicing = await getEntries('pru-servicing');
  let changed = false;
  for(const client of clients){
    const sourceKey = client.ts || `${client.name}|${client.submitted || ''}`;
    const existing = servicing.find(entry =>
      entry.sourceClientKey === sourceKey ||
      (!entry.sourceClientKey && entry.name === client.name && (entry.issuedDate || entry.submitted || '') === (client.submitted || ''))
    );
    if(existing){
      Object.assign(existing, client, {
        issuedDate: client.submitted || '',
        servicingType: client.clientType || existing.servicingType || 'Own',
        sourceClientKey: sourceKey
      });
      changed = true;
      continue;
    }
    servicing.push({
      ...client,
      issuedDate: client.submitted || '',
      servicingType: client.clientType || 'Own',
      sourceClientKey: sourceKey,
      ts: Date.now() + Math.random()
    });
    changed = true;
  }
  if(changed) await saveEntries('pru-servicing', servicing);
}
async function syncServicingToClients(){
  const servicing = await getEntries('pru-servicing');
  const clients = await getEntries('pru-clients');
  let changed = false;
  for(const service of servicing.filter(row => row.status === 'Issued')){
    const sourceKey = service.sourceClientKey || service.sourceLeadKey || `servicing:${service.ts || `${service.name}|${service.issuedDate || ''}`}`;
    const existing = clients.find(client => client.sourceServicingKey === sourceKey || client.ts === service.ts || (client.name === service.name && (client.submitted || '') === (service.issuedDate || '')));
    const clientData = {
      ...service,
      name: service.name || '',
      submitted: service.issuedDate || service.submitted || '',
      status: 'Issued',
      clientType: service.servicingType || service.clientType || 'Own',
      sourceServicingKey: sourceKey,
      ts: existing?.ts || Date.now() + Math.random()
    };
    if(existing) Object.assign(existing, clientData);
    else clients.push(clientData);
    changed = true;
  }
  if(changed) await saveEntries('pru-clients', clients);
}

async function renderTable(id){
  const config = TABLE_LEAVES[id];
  const allEntries = await getEntries(id);
  const entries = id === 'pru-clients' && clientYearFilter !== 'all'
    ? allEntries.filter(row => {
        const issuedDate = submittedDateFromMonth(row.submitted, 2026);
        return issuedDate && issuedDate.getFullYear() === Number(clientYearFilter);
      })
    : allEntries;
  const fypAsOfDate = new Date();
  const listEl = document.getElementById(id + '-list');
  const totalsEl = document.getElementById(id + '-totals');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;

  // Totals — computed regardless of entry count and shown big, above the table.
  const totals = {};
  config.totalKeys.forEach(k => totals[k] = 0);
  entries.forEach(row => {
    config.totalKeys.forEach(k => {
      const col = config.columns.find(c => c.key === k);
      totals[k] += (col && col.type === 'computed') ? clientFYP(row, fypAsOfDate) : parseCurrency(row[k]);
    });
  });
  if(totalsEl){
    const today = new Date();
    const currentYear = today.getFullYear();
    const issuedEntries = allEntries.filter(row => !row.status || String(row.status).toLowerCase() === 'issued');
    const ownIssuedEntries = issuedEntries.filter(row => (row.clientType || 'Own') === 'Own');
    const ytdRows = issuedEntries.filter(row => {
      const issuedDate = submittedDateFromMonth(row.submitted, currentYear);
      return issuedDate
        && issuedDate.getFullYear() === currentYear
        && issuedDate <= today
        && (row.clientType || 'Own') === 'Own';
    });
    const ytdEntries = ytdRows.length;
    const sumRows = (rows, key) => rows.reduce((sum, row) => sum + parseCurrency(row[key]), 0);
    const ytdAPE = sumRows(ytdRows, 'ape');
    const ytdPremium = sumRows(ytdRows, 'premium');
    const ytdSA = sumRows(ytdRows, 'sa');
    const totalAPE = sumRows(issuedEntries, 'ape');
    const totalPremium = sumRows(issuedEntries, 'premium');
    const totalSA = sumRows(issuedEntries, 'sa');
    const ownCount = issuedEntries.filter(row => (row.clientType || 'Own') === 'Own').length;
    const adoptedCount = issuedEntries.filter(row => row.clientType === 'Adopted').length;
    totalsEl.innerHTML = `
      <div class="client-metrics">
        <div class="client-metrics-primary">
          <div class="client-metric"><div class="client-metric-label">YTD Total No. of Clients</div><div class="client-metric-value">${ytdEntries}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total APE</div><div class="client-metric-value">${fmtCurrency(ytdAPE)}</div></div>
          <div class="client-metric"><div class="client-metric-label">FYP</div><div class="client-metric-value">${fmtCurrency(ownIssuedEntries.reduce((sum, row) => sum + clientFYP(row, fypAsOfDate), 0))}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total Premium</div><div class="client-metric-value">${fmtCurrency(ytdPremium)}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total SA</div><div class="client-metric-value">${fmtCurrency(ytdSA)}</div></div>
        </div>
        <div class="client-metrics-secondary">
          <div class="client-metric secondary"><div class="client-metric-label">Active Clients</div><div class="client-metric-value">${ownCount + adoptedCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Adopted Clients</div><div class="client-metric-value">${adoptedCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Own Clients</div><div class="client-metric-value">${ownCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total APE Since Inception</div><div class="client-metric-value">${fmtCurrency(totalAPE)}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total Premium Since Inception</div><div class="client-metric-value">${fmtCurrency(totalPremium)}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total SA Since Inception</div><div class="client-metric-value">${fmtCurrency(totalSA)}</div></div>
        </div>
      </div>`;
  }

  if(entries.length === 0){
    listEl.innerHTML = `<div class="empty">No entries yet — add your first client above.</div>`;
    await renderGroupCount(idToGroup(id));
    if(id === 'pru-clients') await renderRewardsPanel();
    return;
  }

  const sortMode = sortState[id] || 'date-asc';
  const statusFiltered = sortMode === 'status-issued'
    ? entries.filter(row => !row.status || String(row.status).toLowerCase() === 'issued')
    : sortMode === 'status-lapsed'
      ? entries.filter(row => String(row.status || '').toLowerCase() === 'lapsed')
      : entries;
  const sorted = [...statusFiltered].sort((a, b) => {
    if(sortMode === 'name-asc'){
      return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
    }
    if(sortMode === 'date-asc'){
      const aDate = submittedDateFromMonth(a.submitted, 2026);
      const bDate = submittedDateFromMonth(b.submitted, 2026);
      return (aDate ? aDate.getTime() : 0) - (bDate ? bDate.getTime() : 0);
    }
    if(sortMode === 'plan-asc') return (a.plan || '').localeCompare(b.plan || '');
    if(sortMode === 'mode-asc') return (a.mode || '').localeCompare(b.mode || '');
    if(sortMode === 'ape-desc'){
      return parseCurrency(b.ape) - parseCurrency(a.ape);
    }
    return (a.ts || 0) - (b.ts || 0);
  });

  const sortSelect = document.getElementById(id + '-sort');
  if(sortSelect) sortSelect.value = sortMode;
  const yearSelect = document.getElementById(id + '-year');
  if(yearSelect) yearSelect.value = clientYearFilter;

  const headCells = config.columns.map(c => `<th>${c.label}</th>`).join('') + '<th></th>';
  const query = searchState[id] || '';
  const filtered = query
    ? sorted.filter(row => Object.values(row).some(value => String(value ?? '').toLowerCase().includes(query)))
    : sorted;
  const bodyRows = filtered.map(row => {
    const idx = allEntries.indexOf(row);
    const cells = config.columns.map(c => {
      const v = row[c.key];
      if(c.type === 'computed'){
        return `<td class="num">${fmtCurrency(clientFYP(row, fypAsOfDate))}</td>`;
      }
      if(c.type === 'currency'){
        return `<td class="num">${fmtCurrency(parseCurrency(v))}</td>`;
      }
      if(c.type === 'date'){
        return `<td>${escapeHtml(fmtIssuedDate(v || ''))}</td>`;
      }
      if(c.type === 'url'){
        const href = contactHref(v);
        return `<td>${href ? `<a class="contact-link" href="${escapeHtml(href)}" target="_blank" rel="noopener">Open Link</a>` : ''}</td>`;
      }
      if(c.key === 'status' && v){
        return `<td><span class="status-pill status-${v.replace(' ','\\ ')}">${escapeHtml(v)}</span></td>`;
      }
      return `<td>${escapeHtml(v || '')}</td>`;
    }).join('');
    return `<tr>${cells}<td><button class="row-del" onclick="editTableRow('${id}', ${idx})">Edit</button>&nbsp;&nbsp;<button class="row-del" onclick="deleteEntry('${id}', ${idx})">Remove</button></td></tr>`;
  }).join('');

  listEl.innerHTML = `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
  `;
  await renderGroupCount(idToGroup(id));
  if(id === 'pru-clients') await renderRewardsPanel();
}

function idToGroup(leafId){
  const g = GROUPS.find(g => g.items.some(i => i.id === leafId));
  return g ? g.id : null;
}

async function renderGroupCount(groupId){
  if(!groupId) return;
  const group = GROUPS.find(g => g.id === groupId);
  const el = document.getElementById('gcount-' + groupId);
  if(group.id === 'sites'){
    if(el) el.textContent = group.items.length;
    return;
  }
  let total = 0;
  for(const item of group.items){
    const entries = await getEntries(item.id);
    total += entries.length;
  }
  if(el) el.textContent = total;
}

async function renderAllCounts(){
  await Promise.all(GROUPS.map(async g => {
    await Promise.all(g.items.filter(item => !item.url).map(async item => {
      const entries = await getEntries(item.id);
      const bcount = document.getElementById('bcount-' + item.id);
      if(bcount) bcount.textContent = entries.length;
    }));
    await renderGroupCount(g.id);
  }));
}

async function addEntry(id){
  const title = document.getElementById(id + '-title').value.trim();
  const date = document.getElementById(id + '-date').value;
  const value = document.getElementById(id + '-value').value.trim();
  const contactLink = document.getElementById(id + '-contact-link').value.trim();
  const notes = document.getElementById(id + '-notes').value.trim();
  const noteEl = document.getElementById(id + '-savenote');

  if(!title && !value && !notes && !contactLink){
    noteEl.textContent = 'Add at least a title, value, or note first.';
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], title, date, value, contactLink, notes };
  }else{
    entries.push({ title, date, value, contactLink, notes, ts: Date.now() });
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-contact-link').value = '';
    document.getElementById(id + '-notes').value = '';
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add entry');
  }else{
    noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.');
    noteEl.style.color = 'var(--red)';
  }
  renderList(id);
}

// Mirrors the key each side stamps on itself during sync, so delete can
// reliably find the linked record on the other side instead of guessing.
function clientOwnKey(client){
  return client.ts || `${client.name}|${client.submitted || ''}`;
}
function servicingOriginKey(service){
  return service.sourceClientKey || service.sourceLeadKey || `servicing:${service.ts || `${service.name}|${service.issuedDate || ''}`}`;
}

async function deleteEntry(id, idx){
  const entries = await getEntries(id);
  const record = entries[idx];
  if(!record) return;
  const linked = [];
  if(id === 'pru-clients'){
    const servicing = await getEntries('pru-servicing');
    const key = clientOwnKey(record);
    const match = servicing.filter(item =>
      item.sourceClientKey === key ||
      (!item.sourceClientKey && item.name === record.name && (item.issuedDate || item.submitted || '') === (record.submitted || ''))
    );
    match.forEach(item => linked.push({ sectionId:'pru-servicing', record:item }));
  }else if(id === 'pru-servicing'){
    const clients = await getEntries('pru-clients');
    // A servicing row's linked client is either the client it was originally
    // synced FROM (client.ts === record.sourceClientKey), or — if this
    // servicing row was added directly and later synced INTO clients — the
    // client whose sourceServicingKey points back at this row's origin key.
    const match = clients.filter(item =>
      (record.sourceClientKey && item.ts === record.sourceClientKey) ||
      item.sourceServicingKey === servicingOriginKey(record) ||
      item.name === record.name
    );
    match.forEach(item => linked.push({ sectionId:'pru-clients', record:item }));
  }

  // 1. Copy to Trash first. If this write fails, stop — nothing has been
  //    removed from the live lists yet, so there's nothing to roll back.
  const archived = await archiveTrash(id, [record], linked);
  if(!archived){
    showDeleteError(id, 'Could not remove' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    return;
  }

  // 2. Remove the record from its own section. If this write fails, undo
  //    the trash copy so we don't end up with a duplicate sitting there
  //    while the "live" record is still visible everywhere.
  entries.splice(idx, 1);
  const savedMain = await saveEntries(id, entries);
  if(!savedMain){
    await removeFromTrashByRecord(id, record);
    showDeleteError(id, 'Could not remove' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    await renderList(id);
    return;
  }

  // 3. Remove any linked record (client <-> servicing) from its section.
  //    If one of these fails, surface it but keep the primary delete —
  //    the trash copy still exists so nothing is lost, and refreshing
  //    will re-sync clients/servicing from whichever side saved.
  let linkedFailed = false;
  for(const item of linked){
    const other = await getEntries(item.sectionId);
    const otherIndex = other.indexOf(item.record);
    if(otherIndex >= 0){
      other.splice(otherIndex, 1);
      const savedLinked = await saveEntries(item.sectionId, other);
      if(!savedLinked) linkedFailed = true;
    }
  }

  await Promise.all(['pru-clients','pru-servicing'].filter(sectionId => sectionId !== id).map(sectionId => renderList(sectionId)));
  await refreshAfterClientChange(id);

  if(linkedFailed){
    showDeleteError(id, 'Removed, but a linked record could not be updated' + (window.lastFbError ? ' — ' + window.lastFbError : '.'));
  }
}

async function removeFromTrashByRecord(sectionId, record){
  const trash = await getEntries('pru-trash');
  const index = trash.findIndex(item => item.sectionId === sectionId && item.record === record);
  if(index >= 0){
    trash.splice(index, 1);
    await saveEntries('pru-trash', trash);
  }
}

async function clearEntries(id){
  if(!confirm('Remove all entries in this section? This cannot be undone.')) return;
  const entries = await getEntries(id);
  if(!(await archiveTrash(id, entries))) return;
  const ok = await saveEntries(id, []);
  if(!ok){
    // Undo the trash copy so a failed clear doesn't leave duplicates behind.
    const trash = await getEntries('pru-trash');
    const remaining = trash.filter(item => !(item.sectionId === id && entries.includes(item.record)));
    await saveEntries('pru-trash', remaining);
    showDeleteError(id, 'Could not clear entries' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    return;
  }
  await refreshAfterClientChange(id);
}

async function archiveTrash(sectionId, records, linked = []){
  if(!records || !records.length) return true;
  const trash = await getEntries('pru-trash');
  records.filter(Boolean).forEach(record => trash.push({ sectionId, record, deletedAt: new Date().toISOString(), trashId: `${sectionId}-${Date.now()}-${Math.random()}` }));
  linked.forEach(item => trash.push({ sectionId:item.sectionId, record:item.record, deletedAt: new Date().toISOString(), trashId: `${item.sectionId}-${Date.now()}-${Math.random()}` }));
  const ok = await saveEntries('pru-trash', trash);
  if(!ok) window.lastFbError = window.lastFbError || 'Trash could not be saved';
  return ok;
}
async function openTrash(){
  const modal = document.getElementById('trash-modal');
  if(!modal) return;
  await renderTrash();
  modal.classList.add('open');
}
function closeTrash(){ document.getElementById('trash-modal')?.classList.remove('open'); }
async function renderTrash(){
  const list = document.getElementById('trash-list');
  if(!list) return;
  const trash = await getEntries('pru-trash');
  list.innerHTML = trash.length ? trash.map((item, idx) => `
    <div class="trash-item"><div><div class="trash-item-title">${escapeHtml(item.record.name || item.record.title || 'Deleted record')}</div><div class="trash-item-meta">${escapeHtml(item.sectionId)} · deleted ${new Date(item.deletedAt).toLocaleString()}</div></div><button class="primary" onclick="restoreTrash(${idx})">Restore</button></div>`).join('') : '<div class="empty">Trash is empty.</div>';
}
async function restoreTrash(index){
  const trash = await getEntries('pru-trash');
  const item = trash[index];
  if(!item) return;
  const records = await getEntries(item.sectionId);
  records.push(item.record);
  await saveEntries(item.sectionId, records);
  trash.splice(index, 1);
  await saveEntries('pru-trash', trash);
  await refreshAfterClientChange(item.sectionId);
  await renderTrash();
}
async function emptyTrash(){
  if(!confirm('Permanently empty Trash? This cannot be undone.')) return;
  await saveEntries('pru-trash', []);
  await renderTrash();
}

/* ---------- init ---------- */
async function seedIfEmpty(){
  await Promise.all(Object.entries(SEED_DATA).map(async ([id, rows]) => {
    const existing = await getEntries(id);
    if(existing.length === 0){
      const seeded = rows.map(row => ({ ...row, ts: Date.now() + Math.random() }));
      await saveEntries(id, seeded);
    }
  }));
}

function renderTodayBadge(){
  const el = document.getElementById('today-badge');
  if(!el) return;
  const d = new Date();
  el.textContent = 'Today · ' + d.toLocaleDateString('en-US', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
}

window.initApp = async function initApp(){
  restoreViewState();
  renderTodayBadge();
  renderGroupNav();
  renderBoxGrid();
  renderView();
  await primeCache();
  await Promise.all(allLeafIds().map(id => renderList(id)));
  await renderAllCounts();

  await seedIfEmpty();
  await migrateExistingIssuedLeads();
  await syncClientsToServicing();
  await syncServicingToClients();
  await Promise.all(['pru-clients','pru-leads','pru-servicing'].map(id => renderList(id)));
  await renderAllCounts();
  await renderRewardsPanel();
  if(statisticsOpen) await renderStatisticsPanel();
};
</script>
