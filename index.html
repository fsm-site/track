<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benefits Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #262624;
    --navy-soft: #34322E;
    --ivory: #F9F8F4;
    --ink: #3D3D3A;
    --ink-soft: #87867E;
    --brass: #C1633D;
    --brass-soft: #F1DDCB;
    --line: #E5E2D9;
    --red: #BC4B3C;
    --stripe: #F3F1EA;
    --brass-dark: #A8532E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:var(--ivory);
    color:var(--ink);
    display:flex;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .sidebar{
    width:210px;
    flex-shrink:0;
    background:var(--stripe);
    border-right:1px solid var(--line);
    color:var(--ink);
    padding:28px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    font-family:'Inter', sans-serif;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-0.2px;
    padding:0 4px 22px 4px;
  }
  .brand span{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
    font-weight:400;
    letter-spacing:0;
  }
  .nav-item{
    all:unset;
    cursor:pointer;
    padding:10px 12px;
    border-radius:9px;
    font-size:14.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:background 0.15s ease, color 0.15s ease;
    gap:8px;
  }
  .nav-item:hover{
    background:rgba(0,0,0,0.045);
    color:var(--ink);
  }
  .nav-item.active{
    background:var(--brass);
    color:#fff;
    font-weight:500;
  }
  .nav-item .count{
    font-size:11px;
    color:var(--ink-soft);
    background:rgba(0,0,0,0.05);
    padding:1px 7px;
    border-radius:100px;
    min-width:20px;
    text-align:center;
  }
  .nav-item.active .count{
    color:#fff;
    background:rgba(255,255,255,0.22);
  }

  main{
    flex:1;
    padding:40px 48px;
    max-width:1600px;
    width:100%;
  }
  h1{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:-0.3px;
    margin:0 0 4px 0;
  }
  .sub{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:28px;
  }

  /* --- big box grid --- */
  .box-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .box{
    all:unset;
    cursor:pointer;
    border:1px solid var(--line);
    background:#fff;
    border-radius:16px;
    padding:26px 24px;
    display:flex;
    flex-direction:column;
    gap:18px;
    transition:border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .box:hover{
    border-color:var(--brass);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(38,38,36,0.07);
  }
  .box .box-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .box .box-count{
    font-family:'Inter', sans-serif;
    font-size:25px;
    font-weight:700;
    color:var(--navy);
    letter-spacing:-0.4px;
  }
  .box .box-count-label{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:-4px;
  }
  .box .box-label{
    font-size:16.5px;
    font-weight:600;
    color:var(--ink);
    line-height:1.3;
  }
  .box .box-arrow{
    font-size:18px;
    color:var(--brass);
  }

  /* --- leaf detail view --- */
  .leaf-view{ display:none; }
  .leaf-view.visible{
    display:block;
    animation:fade 0.2s ease;
  }
  .back-link{
    all:unset;
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:14px;
  }
  .back-link:hover{ color:var(--navy); }

  @keyframes fade{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:12px;
    background:#fff;
  }

  /* entry form (generic sections) */
  .entry-form{
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    background:#fff;
    margin-bottom:22px;
  }
  .entry-form .fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 12px;
    margin-bottom:10px;
  }
  .entry-form .fields .full{
    grid-column:1 / -1;
  }
  label{
    font-size:11.5px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
    font-weight:500;
  }
  input, textarea, select{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--ivory);
    color:var(--ink);
  }
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--brass-soft);
    outline-offset:0;
    border-color:var(--brass);
  }
  textarea{ resize:vertical; min-height:44px; }
  .form-actions{
    display:flex;
    justify-content:flex-end;
  }
  button.primary{
    all:unset;
    cursor:pointer;
    background:var(--brass);
    color:#fff;
    font-size:13px;
    font-weight:600;
    padding:9px 18px;
    border-radius:8px;
    transition:background 0.15s ease;
  }
  button.primary:hover{ background:var(--brass-dark); }

  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .list-head h3{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:14.5px;
    margin:0;
    letter-spacing:-0.1px;
  }
  .clear-link{
    all:unset;
    cursor:pointer;
    font-size:12px;
    color:var(--red);
  }
  .clear-link:hover{ text-decoration:underline; }

  .entry{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding:2px 0;
  }
  .entry .info{ flex:1; }
  .entry .title-line{
    font-size:14px;
    font-weight:500;
    display:flex;
    gap:8px;
    align-items:baseline;
    flex-wrap:wrap;
  }
  .entry .date{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:400;
  }
  .entry .value{
    font-family:'Inter', sans-serif;
    font-weight:600;
    color:var(--navy);
    font-size:13.5px;
  }
  .entry .notes{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
    line-height:1.4;
  }
  .entry .del{
    all:unset;
    cursor:pointer;
    font-size:12px;
    color:var(--ink-soft);
    padding:3px 6px;
  }
  .entry .del:hover{ color:var(--red); }

  .empty{
    color:var(--ink-soft);
    font-size:13.5px;
    padding:6px 0;
  }
  .save-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:-6px;
    margin-bottom:18px;
    min-height:14px;
  }

  /* --- table-style sections (e.g. 2026 Clients) --- */
  .table-scroll{
    border:1px solid var(--line);
    border-radius:12px;
    overflow-x:auto;
    background:#fff;
    margin-bottom:8px;
  }
  table.data-table{
    border-collapse:collapse;
    width:100%;
    min-width:820px;
    font-size:13.5px;
  }
  table.data-table th{
    text-align:left;
    background:var(--stripe);
    color:var(--ink);
    font-size:11.5px;
    font-weight:600;
    padding:11px 12px;
    white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  table.data-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  table.data-table tbody tr:hover{ background:var(--brass-soft); }
  table.data-table td.num{ font-family:'Inter', sans-serif; font-weight:600; color:var(--navy); }
  table.data-table tfoot td{
    font-weight:700;
    font-family:'Inter', sans-serif;
    color:var(--navy);
    border-top:2px solid var(--navy);
    border-bottom:none;
    background:#fff;
  }
  table.data-table .row-del{
    all:unset;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:12px;
  }
  table.data-table .row-del:hover{ color:var(--red); }
  .status-pill{
    display:inline-block;
    font-size:11.5px;
    padding:2px 9px;
    border-radius:100px;
    font-weight:500;
  }
  .status-Issued{ background:#DEEBDD; color:#3A6B44; }
  .status-Pending{ background:#F6E9CE; color:#8F6A2E; }
  .status-In\ Process{ background:#E1E6F0; color:#3F5480; }
  .status-Declined{ background:#F4DBD5; color:#A54936; }

  .table-form{
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    background:#fff;
    margin-bottom:16px;
  }
  .table-form .fields{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px 12px;
    margin-bottom:12px;
  }
  .table-form .fields .span2{ grid-column:span 2; }

  /* --- today badge (sidebar) --- */
  .today-badge{
    font-size:11px;
    color:var(--ink-soft);
    padding:0 4px 18px 4px;
    margin-top:-8px;
    letter-spacing:0.2px;
  }

  /* --- achievements / travel progress cards --- */
  .rewards-section{ margin-bottom:30px; }
  .rewards-section h2{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:19px;
    margin:0 0 4px 0;
    color:var(--navy);
    letter-spacing:-0.1px;
  }
  .rewards-section .rs-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .achv-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .achv-card{
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 28px;
    background:#fff;
  }
  .achv-card.done{
    border-color:var(--brass);
    background:linear-gradient(0deg,#fff,var(--brass-soft) 180%);
  }
  .achv-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .achv-name{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .achv-pct{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--navy);
    flex-shrink:0;
  }
  .achv-card.done .achv-pct{ color:var(--brass); }
  .achv-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .achv-sub strong{ color:var(--ink); font-weight:600; }
  .progress-track{
    height:11px;
    border-radius:100px;
    background:var(--stripe);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:100px;
    background:var(--navy);
    transition:width 0.3s ease;
  }
  .achv-card.done .progress-fill{ background:var(--brass); }
  .achv-badge{
    display:inline-block;
    font-size:12.5px;
    font-weight:600;
    color:var(--brass-dark);
    background:var(--brass-soft);
    border-radius:100px;
    padding:4px 13px;
    margin-top:12px;
  }
  .togo-line{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .togo-line strong{
    display:block;
    color:var(--brass-dark);
    font-size:18px;
    font-weight:700;
    margin-top:2px;
  }
  .achv-card.done .togo-line strong,
  .travel-card.done .togo-line strong{ color:var(--brass); }
  .travel-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .travel-card{
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 28px;
    background:#fff;
  }
  .travel-card .achv-name{ font-size:17px; }
  .travel-card .loc{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .travel-card .deadline{
    font-size:12.5px;
    color:var(--red);
    margin-top:12px;
    font-weight:500;
  }
  .travel-card .deadline.past{ color:var(--ink-soft); }

  /* --- auth / login screen --- */
  #login-screen{
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ivory);
  }
  .login-box{
    width:100%;
    max-width:360px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px 28px;
    box-shadow:0 8px 24px rgba(38,38,36,0.05);
  }
  .login-box .brand{
    padding:0 0 22px 0;
    color:var(--navy);
  }
  .login-box .brand span{ color:var(--ink-soft); }
  .login-box label{ margin-top:12px; }
  .login-box label:first-of-type{ margin-top:0; }
  .login-error{
    font-size:12.5px;
    color:var(--red);
    min-height:16px;
    margin-top:10px;
  }
  .login-box button.primary{
    width:100%;
    text-align:center;
    margin-top:16px;
    padding:10px 16px;
  }
  #app-shell{ display:none; }
  .signout-link{
    all:unset;
    cursor:pointer;
    font-size:12px;
    color:var(--ink-soft);
    padding:8px 4px 0 4px;
    margin-top:auto;
  }
  .signout-link:hover{ color:var(--brass); }
  .sidebar-user{
    font-size:11px;
    color:var(--ink-soft);
    padding:0 4px;
    word-break:break-all;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="brand">Benefits<span>Employee dashboard</span></div>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">
    <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin-top:6px; cursor:pointer;">
      <input type="checkbox" id="login-show-pw" style="width:auto;"> Show password
    </label>
    <div class="login-error" id="login-error"></div>
    <button class="primary" id="login-submit">Sign in</button>
  </div>
</div>

<div id="app-shell" style="display:flex; width:100%;">
  <div class="sidebar" style="display:flex; flex-direction:column;">
    <div class="brand">Benefits<span>Employee dashboard</span></div>
    <div class="today-badge" id="today-badge"></div>
    <div id="group-nav"></div>
    <div class="sidebar-user" id="sidebar-user"></div>
    <button class="signout-link" id="signout-btn">Sign out</button>
  </div>

  <main>
    <h1 id="group-title">Pru</h1>
    <div class="sub" id="group-sub">Tap a section to open it.</div>

    <div class="box-grid" id="box-grid"></div>
    <div id="leaf-mount"></div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC9VjcOcgGLhKc65mRC0w9O-lPMzkuQhMM",
    authDomain: "zethmasterlist.firebaseapp.com",
    projectId: "zethmasterlist",
    storageBucket: "zethmasterlist.firebasestorage.app",
    messagingSenderId: "807721959686",
    appId: "1:807721959686:web:36ab34d2be9c17836f5e87",
    measurementId: "G-P7RRV8PQ6C"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let hasInitedApp = false;

  /* each dashboard "id" (e.g. pru-clients) is stored as one Firestore
     document at users/{uid}/entries/{id}, holding { value: [...] } */
  window.fbGetEntries = async function(id){
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return [];
    try{
      const snap = await getDoc(doc(db, "users", uid, "entries", id));
      if(!snap.exists()) return [];
      return snap.data().value || [];
    }catch(e){
      console.error("fbGetEntries failed", e);
      window.lastFbError = e.code || e.message;
      return [];
    }
  };
  window.fbSaveEntries = async function(id, entries){
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return false;
    try{
      await setDoc(doc(db, "users", uid, "entries", id), { value: entries });
      window.lastFbError = null;
      return true;
    }catch(e){
      console.error("fbSaveEntries failed", e);
      window.lastFbError = e.code || e.message;
      return false;
    }
  };

  const loginScreen = document.getElementById('login-screen');
  const appShell = document.getElementById('app-shell');
  const loginError = document.getElementById('login-error');
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');

  const ERROR_MESSAGES = {
    'auth/invalid-credential': 'Wrong email or password.',
    'auth/wrong-password': 'Wrong password.',
    'auth/user-not-found': 'No account found for that email.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/too-many-requests': 'Too many attempts — wait a bit and try again.',
    'auth/network-request-failed': 'Network error — check your connection.',
  };
  async function doSignIn(){
    loginError.textContent = '';
    const email = emailEl.value.trim();
    const password = passwordEl.value;
    if(!email || !password){
      loginError.textContent = 'Enter your email and password.';
      return;
    }
    try{
      await signInWithEmailAndPassword(auth, email, password);
    }catch(e){
      console.error('Firebase sign-in error:', e.code, e.message);
      loginError.textContent = ERROR_MESSAGES[e.code] || ('Sign-in failed (' + (e.code || 'unknown error') + ').');
    }
  }
  document.getElementById('login-submit').addEventListener('click', doSignIn);
  document.getElementById('login-show-pw').addEventListener('change', (e) => {
    passwordEl.type = e.target.checked ? 'text' : 'password';
  });
  passwordEl.addEventListener('keydown', e => { if(e.key === 'Enter') doSignIn(); });
  emailEl.addEventListener('keydown', e => { if(e.key === 'Enter') doSignIn(); });
  document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if(user){
      loginScreen.style.display = 'none';
      appShell.style.display = 'flex';
      const userLabel = document.getElementById('sidebar-user');
      if(userLabel) userLabel.textContent = user.email || '';
      if(!hasInitedApp){
        hasInitedApp = true;
        if(window.initApp) window.initApp();
      }
    }else{
      appShell.style.display = 'none';
      loginScreen.style.display = 'flex';
      passwordEl.value = '';
    }
  });
</script>

<script>
/* ---------- config ---------- */
const GROUPS = [
  { id: "pru", label: "Pru", items: [
    { id: "pru-rewards", label: "2026 Rewards & Achievements" },
    { id: "pru-clients", label: "2026 Clients" },
    { id: "pru-leads", label: "Pru Leads" },
    { id: "prufin", label: "Prufin" },
  ]},
  { id: "hmo", label: "HMO", items: [
    { id: "hmo-clients", label: "2026 Clients" },
    { id: "hmo-leads", label: "HMO Leads" },
    { id: "hmo-commissions", label: "Commissions" },
  ]},
  { id: "money", label: "Money Matters", items: [
    { id: "money-income", label: "Sources of Income" },
    { id: "money-flow", label: "Monthly Flow" },
    { id: "money-ledger", label: "Ledger" },
  ]},
];

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const PLAN_OPTIONS = ["PAA+","Elite 15","Elite 10","Elite 7","Elite 5","Exact 5","Exact 10","Exact 15","PLFL 20","PLFL 15","PLFL 10","PLFL 5","PYT","PSI","PLI 5","PLI 10","PruMil","PIA","PruWealth"];

const MODE_OPTIONS = ["Annual","Semi-Annual","Quarterly","Monthly"];
const MODE_FREQ = { "Annual": 1, "Semi-Annual": 2, "Quarterly": 4, "Monthly": 12 };

/* -- rolling-12-month FYP (First Year Premium: premiums actually paid, in a
   trailing 12-month window from the client's submitted month) -- */
function submittedDateFromMonth(monthName, year){
  const idx = MONTHS.indexOf(monthName);
  if(idx === -1) return null;
  return new Date(year, idx, 1);
}
function computeFYP(row){
  const premium = parseCurrency(row.premium);
  const freq = MODE_FREQ[row.mode];
  if(!premium || !freq || !row.submitted) return 0;
  const start = submittedDateFromMonth(row.submitted, 2026);
  if(!start) return 0;
  const today = new Date();
  let monthsElapsed = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
  if(monthsElapsed < 0) monthsElapsed = 0;
  const rollingMonths = Math.min(monthsElapsed, 12); // trailing 12-month cap
  const periodMonths = 12 / freq;
  const paymentsMade = Math.min(freq, Math.floor(rollingMonths / periodMonths) + 1);
  return paymentsMade * premium;
}

/* ---------- storage helpers ----------
   Backed by Firestore (see the type="module" script above), scoped to the
   signed-in user's account, so data syncs across any browser or device you
   log into.

   entriesCache holds every section's data in memory once it's been fetched.
   primeCache() fetches ALL sections in one parallel batch on load (instead of
   one Firestore round trip per section, done one after another) — this is
   what used to make the dashboard take up to a minute to open. Everything
   below reads from the cache and only re-hits Firestore when data changes. */
const entriesCache = {};
function allLeafIds(){
  const ids = [];
  GROUPS.forEach(g => g.items.forEach(item => ids.push(item.id)));
  return ids;
}
async function primeCache(){
  const ids = allLeafIds();
  const results = await Promise.all(ids.map(id => window.fbGetEntries(id)));
  ids.forEach((id, i) => { entriesCache[id] = results[i]; });
}
async function getEntries(id){
  if(entriesCache[id]) return entriesCache[id];
  const entries = await window.fbGetEntries(id);
  entriesCache[id] = entries;
  return entries;
}
async function saveEntries(id, entries){
  const ok = await window.fbSaveEntries(id, entries);
  if(ok) entriesCache[id] = entries;
  return ok;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
function parseCurrency(s){
  if(!s) return 0;
  const n = parseFloat(String(s).replace(/[₱,\s]/g, ''));
  return isNaN(n) ? 0 : n;
}
function fmtCurrency(n){
  return '₱' + (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* -- structured table panel builder -- */
function buildTablePanel(item, groupLabel, config){
  const el = document.createElement('div');
  el.className = 'leaf-view';
  el.id = 'leaf-' + item.id;

  const fieldInputs = config.columns.map(col => {
    if(col.type === 'computed') return '';
    const wide = col.type === 'text' ? 'span2' : '';
    if(col.type === 'select'){
      return `
        <div class="${wide}">
          <label>${col.label}</label>
          <select id="${item.id}-f-${col.key}">
            <option value="">—</option>
            ${col.options.map(o => `<option value="${o}">${o}</option>`).join('')}
          </select>
        </div>`;
    }
    if(col.type === 'currency'){
      const hint = col.key === 'ape' ? ' <span style="font-weight:400; color:var(--ink-soft);">(auto)</span>' : '';
      return `
        <div>
          <label>${col.label}${hint}</label>
          <input id="${item.id}-f-${col.key}" type="text" placeholder="0.00">
        </div>`;
    }
    return `
      <div class="${wide}">
        <label>${col.label}</label>
        <input id="${item.id}-f-${col.key}" type="text" placeholder="${col.placeholder || ''}">
      </div>`;
  }).join('');

  const legendHtml = config.legend ? `
    <div class="sub" style="margin-top:-18px; margin-bottom:22px;">
      ${config.legend.map(([abbr, full]) => `<strong>${abbr}</strong> = ${full}`).join(' &nbsp;·&nbsp; ')}
    </div>` : '';

  el.innerHTML = `
    <button class="back-link" onclick="backToGrid()">← ${groupLabel}</button>
    <h1>${item.label}</h1>
    <div class="sub">${groupLabel}</div>
    ${legendHtml}

    <div class="table-form">
      <div class="fields">${fieldInputs}</div>
      <div class="form-actions">
        <button class="clear-link" id="${item.id}-cancel" style="display:none; margin-right:auto;" onclick="cancelEdit('${item.id}')">Cancel edit</button>
        <button class="primary" id="${item.id}-submit" onclick="addTableRow('${item.id}')">Add client</button>
      </div>
    </div>
    <div class="save-note" id="${item.id}-savenote"></div>

    <div class="list-head">
      <h3>Entries</h3>
      <div style="display:flex; align-items:center; gap:14px;">
        <label style="font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin:0;">
          Sort by

            ${buildSortOptions(config)}

      </div>
    </div>
    <div id="${item.id}-list"></div>
  `;
  return el;
}

function progressPct(current, threshold){
  if(!threshold) return 0;
  return Math.max(0, Math.min(100, (current / threshold) * 100));
}

function togoLine(remaining, done, doneLabel){
  return done
    ? `<div class="togo-line">To-Go<strong>${doneLabel || 'Achieved 🎉'}</strong></div>`
    : `<div class="togo-line">To-Go<strong>${fmtCurrency(remaining)}</strong></div>`;
}

async function renderRewardsPanel(){
  const mount = document.getElementById('rewards-mount');
  if(!mount) return; // panel not built yet
  const clients = await getEntries('pru-clients');
  const issued = clients.filter(r => r.status === 'Issued');

  // Achievement Ladder still runs on total Issued APE (all months).
  const totalAPE = issued.reduce((sum, r) => sum + parseCurrency(r.ape), 0);

  // South Korea Travel only counts APE from clients Issued Aug–Nov 2026.
  const skoreaAPE = issued
    .filter(r => SKOREA_WINDOW_MONTHS.includes(r.submitted))
    .reduce((sum, r) => sum + parseCurrency(r.ape), 0);

  // MDRT Annual/Global meetings qualify on FYP, not APE.
  const totalFYP = issued.reduce((sum, r) => sum + computeFYP(r), 0);

  const achvCards = ACHIEVEMENTS.map(a => {
    const pct = progressPct(totalAPE, a.threshold);
    const done = pct >= 100;
    const remaining = Math.max(0, a.threshold - totalAPE);
    return `
      <div class="achv-card ${done ? 'done' : ''}">
        <div class="achv-top">
          <div class="achv-name">${a.label}</div>
          <div class="achv-pct">${pct.toFixed(0)}%</div>
        </div>
        <div class="achv-sub"><strong>${fmtCurrency(totalAPE)}</strong> of ${fmtCurrency(a.threshold)} APE</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${done ? `<div class="achv-badge">Achieved</div>` : ''}
        ${togoLine(remaining, done)}
      </div>`;
  }).join('');

  const today = new Date();
  const travelCards = TRAVEL_INCENTIVES.map(t => {
    const value = t.key === 'skorea' ? skoreaAPE : totalAPE;
    const pct = progressPct(value, t.threshold);
    const done = pct >= 100;
    const remaining = Math.max(0, t.threshold - value);
    const deadline = new Date(t.deadline + 'T00:00:00');
    const msLeft = deadline - today;
    const daysLeft = Math.ceil(msLeft / 86400000);
    const deadlineLabel = daysLeft >= 0
      ? `${daysLeft} day${daysLeft === 1 ? '' : 's'} left · until ${fmtDate(t.deadline)}`
      : `Window closed ${fmtDate(t.deadline)}`;
    return `
      <div class="travel-card ${done ? 'achv-card done' : ''}">
        <div class="achv-top">
          <div class="achv-name">${t.label}</div>
          <div class="achv-pct">${pct.toFixed(0)}%</div>
        </div>
        ${t.windowLabel ? `<div class="loc">${t.windowLabel}</div>` : ''}
        <div class="achv-sub"><strong>${fmtCurrency(value)}</strong> of ${fmtCurrency(t.threshold)} APE</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${done ? `<div class="achv-badge">Qualified</div>` : ''}
        ${togoLine(remaining, done)}
        <div class="deadline ${daysLeft < 0 ? 'past' : ''}">${deadlineLabel}</div>
      </div>`;
  }).join('');

  const mdrtPct = progressPct(totalFYP, MDRT_THRESHOLD);
  const mdrtDone = mdrtPct >= 100;
  const mdrtRemaining = Math.max(0, MDRT_THRESHOLD - totalFYP);
  const mdrtCards = MDRT_MEETINGS.map(m => `
    <div class="travel-card ${mdrtDone ? 'achv-card done' : ''}">
      <div class="achv-top">
        <div class="achv-name">${m.label}</div>
        <div class="achv-pct">${mdrtPct.toFixed(0)}%</div>
      </div>
      <div class="loc">${m.loc}</div>
      <div class="achv-sub"><strong>${fmtCurrency(totalFYP)}</strong> of ${fmtCurrency(MDRT_THRESHOLD)} FYP (MDRT qualification)</div>
      <div class="progress-track"><div class="progress-fill" style="width:${mdrtPct}%"></div></div>
      ${mdrtDone ? `<div class="achv-badge">Qualified</div>` : ''}
      ${togoLine(mdrtRemaining, mdrtDone)}
    </div>`).join('');

  mount.innerHTML = `
    <div class="rewards-section">
      <h2>Achievement Ladder</h2>
      <div class="rs-sub">Based on total Issued APE across your 2026 Clients: <strong>${fmtCurrency(totalAPE)}</strong></div>
      <div class="achv-grid">${achvCards}</div>
    </div>
    <div class="rewards-section">
      <h2>Travel Incentives</h2>
      <div class="rs-sub">South Korea Travel counts Issued APE from Aug–Nov 2026 only · MDRT meetings qualify on FYP</div>
      <div class="travel-grid">${travelCards}${mdrtCards}</div>
    </div>
  `;
}

/* -- Premium × Mode of Payment → APE, live in the add/edit client form --
   Annual×1, Semi-Annual×2, Quarterly×4, Monthly×12 (reuses MODE_FREQ). */
function setupApeAutoCalc(item, config){
  const hasKeys = ['premium','mode','ape'].every(k => config.columns.some(c => c.key === k));
  if(!hasKeys) return;
  const premiumEl = document.getElementById(item.id + '-f-premium');
  const modeEl = document.getElementById(item.id + '-f-mode');
  const apeEl = document.getElementById(item.id + '-f-ape');
  if(!premiumEl || !modeEl || !apeEl) return;
  function recalc(){
    const premium = parseCurrency(premiumEl.value);
    const freq = MODE_FREQ[modeEl.value];
    if(premium && freq) apeEl.value = (premium * freq).toFixed(2);
  }
  premiumEl.addEventListener('input', recalc);
  modeEl.addEventListener('change', recalc);
}

GROUPS.forEach(g => {
  g.items.forEach(item => {
    const tableConfig = TABLE_LEAVES[item.id];
    let panel;
    if(item.id === 'pru-rewards'){
      panel = buildRewardsPanel(item, g.label);
    }else if(tableConfig){
      panel = buildTablePanel(item, g.label, tableConfig);
    }else{
      panel = buildGenericPanel(item, g.label);
    }
    leafMount.appendChild(panel);
    if(tableConfig) setupApeAutoCalc(item, tableConfig);
  });
});

/* ---------- view switching ---------- */

  const showGrid = activeLeaf === null;
  boxGrid.style.display = showGrid ? 'grid' : 'none';
  document.getElementById('group-title').style.display = showGrid ? 'block' : 'none';
  document.getElementById('group-sub').style.display = showGrid ? 'block' : 'none';

    document.getElementById('leaf-' + activeLeaf).classList.add('visible');
  }
}

function selectGroup(groupId){
  activeGroup = groupId;
  activeLeaf = null;
  renderGroupNav();
  renderBoxGrid();
  renderView();
}

function selectLeaf(groupId, leafId){
  activeGroup = groupId;
  activeLeaf = leafId;
  renderGroupNav();
  renderView();
}

function backToGrid(){
  activeLeaf = null;
  renderBoxGrid();
  renderView();
}

/* ---------- rendering: generic list ---------- */
async function renderList(id){
  if(TABLE_LEAVES[id]){
    return renderTable(id);
  }
  const entries = await getEntries(id);
  const listEl = document.getElementById(id + '-list');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;

  if(entries.length === 0){
    listEl.innerHTML = `<div class="empty">No entries yet — add your first one above.</div>`;
  }else{
    const sorted = [...entries].sort((a,b) => (b.ts||0) - (a.ts||0));
    listEl.innerHTML = sorted.map(e => {
      const idx = entries.indexOf(e);
      return `
      <div class="card entry">
        <div class="info">
          <div class="title-line">
            ${e.title ? escapeHtml(e.title) : '<span style="color:var(--ink-soft)">Untitled</span>'}
            ${e.date ? `<span class="date">${fmtDate(e.date)}</span>` : ''}
          </div>
          ${e.value ? `<div class="value">${escapeHtml(e.value)}</div>` : ''}
          ${e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <div style="display:flex; gap:4px; flex-shrink:0;">
          <button class="del" onclick="editEntry('${id}', ${idx})">Edit</button>
          <button class="del" onclick="deleteEntry('${id}', ${idx})">Remove</button>
        </div>
      </div>`;
    }).join('');
  }
  await renderGroupCount(idToGroup(id));
}

/* ---------- rendering: structured table ---------- */
const sortState = {};
function setSort(id, value){
  sortState[id] = value;
  renderTable(id);
}
function buildSortOptions(config){
  const opts = ['<option value="default">Date added</option>'];
  if(config.columns.some(c => c.key === 'name')) opts.push('<option value="name-asc">Name (A\u2013Z)</option>');
  if(config.columns.some(c => c.key === 'submitted')) opts.push('<option value="month-asc">Month submitted</option>');
  if(config.columns.some(c => c.key === 'ape')) opts.push('<option value="ape-desc">Highest APE</option>');
  return opts.join('');
}

async function renderTable(id){
  const config = TABLE_LEAVES[id];
  const entries = await getEntries(id);
  const listEl = document.getElementById(id + '-list');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;

  if(entries.length === 0){
    listEl.innerHTML = `<div class="empty">No entries yet — add your first client above.</div>`;
    await renderGroupCount(idToGroup(id));
    return;
  }

  const sortMode = sortState[id] || 'default';
  const sorted = [...entries].sort((a, b) => {
    if(sortMode === 'name-asc'){
      return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
    }
    if(sortMode === 'month-asc'){
      return MONTHS.indexOf(a.submitted) - MONTHS.indexOf(b.submitted);
    }
    if(sortMode === 'ape-desc'){
      return parseCurrency(b.ape) - parseCurrency(a.ape);
    }
    return (a.ts || 0) - (b.ts || 0);
  });

  const sortSelect = document.getElementById(id + '-sort');
  if(sortSelect) sortSelect.value = sortMode;

  const headCells = config.columns.map(c => `<th>${c.label}</th>`).join('') + '<th></th>';
  const bodyRows = sorted.map(row => {
    const idx = entries.indexOf(row);
    const cells = config.columns.map(c => {
      const v = row[c.key];
      if(c.type === 'computed'){
        return `<td class="num">${fmtCurrency(c.compute(row))}</td>`;
      }
      if(c.type === 'currency'){
        return `<td class="num">${fmtCurrency(parseCurrency(v))}</td>`;
      }
      if(c.key === 'status' && v){
        return `<td><span class="status-pill status-${v.replace(' ','\\ ')}">${escapeHtml(v)}</span></td>`;
      }
      return `<td>${escapeHtml(v || '')}</td>`;
    }).join('');
    return `<tr>${cells}<td><button class="row-del" onclick="editTableRow('${id}', ${idx})">Edit</button>&nbsp;&nbsp;<button class="row-del" onclick="deleteEntry('${id}', ${idx})">Remove</button></td></tr>`;
  }).join('');

  const totals = {};
  config.totalKeys.forEach(k => totals[k] = 0);
  entries.forEach(row => {
    config.totalKeys.forEach(k => {
      const col = config.columns.find(c => c.key === k);
      totals[k] += (col && col.type === 'computed') ? col.compute(row) : parseCurrency(row[k]);
    });
  });
  const totalLabelSpan = config.columns.length - config.totalKeys.length;
  const totalCells = config.columns.map((c, i) => {
    if(config.totalKeys.includes(c.key)){
      return `<td>${fmtCurrency(totals[c.key])}</td>`;
    }
    return i === 0 ? `<td colspan="${totalLabelSpan}">Total</td>` : '';
  }).filter(x => x !== '').join('') + '<td></td>';

  listEl.innerHTML = `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
        <tfoot><tr>${totalCells}</tr></tfoot>
      </table>
    </div>
  `;
  await renderGroupCount(idToGroup(id));
  if(id === 'pru-clients') await renderRewardsPanel();
}

function idToGroup(leafId){
  const g = GROUPS.find(g => g.items.some(i => i.id === leafId));
  return g ? g.id : null;
}

async function renderGroupCount(groupId){
  if(!groupId) return;
  const group = GROUPS.find(g => g.id === groupId);
  let total = 0;
  for(const item of group.items){
    const entries = await getEntries(item.id);
    total += entries.length;
  }
  const el = document.getElementById('gcount-' + groupId);
  if(el) el.textContent = total;
}

async function renderAllCounts(){
  for(const g of GROUPS){
    for(const item of g.items){
      const entries = await getEntries(item.id);
      const bcount = document.getElementById('bcount-' + item.id);
      if(bcount) bcount.textContent = entries.length;
    }
    await renderGroupCount(g.id);
  }
}

/* ---------- edit-mode helpers ---------- */
function setEditMode(id, idx, label){
  editState[id] = idx;
  const btn = document.getElementById(id + '-submit');
  const cancel = document.getElementById(id + '-cancel');
  if(btn) btn.textContent = label;
  if(cancel) cancel.style.display = 'inline';
}
function clearEditMode(id, label){
  editState[id] = null;
  const btn = document.getElementById(id + '-submit');
  const cancel = document.getElementById(id + '-cancel');
  if(btn) btn.textContent = label;
  if(cancel) cancel.style.display = 'none';
}
function cancelEdit(id){
  if(TABLE_LEAVES[id]){
    const config = TABLE_LEAVES[id];
    config.columns.forEach(col => { if(col.type === 'computed') return; document.getElementById(id + '-f-' + col.key).value = ''; });
    clearEditMode(id, 'Add client');
  }else{
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-notes').value = '';
    clearEditMode(id, 'Add entry');
  }
  const noteEl = document.getElementById(id + '-savenote');
  if(noteEl) noteEl.textContent = '';
}

/* ---------- entry CRUD: generic ---------- */
async function addEntry(id){
  const title = document.getElementById(id + '-title').value.trim();
  const date = document.getElementById(id + '-date').value;
  const value = document.getElementById(id + '-value').value.trim();
  const notes = document.getElementById(id + '-notes').value.trim();
  const noteEl = document.getElementById(id + '-savenote');

  if(!title && !value && !notes){
    noteEl.textContent = 'Add at least a title, value, or note first.';
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], title, date, value, notes };
  }else{
    entries.push({ title, date, value, notes, ts: Date.now() });
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-notes').value = '';
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add entry');
  }else{
    noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.');
    noteEl.style.color = 'var(--red)';
  }
  renderList(id);
}

async function editEntry(id, idx){
  const entries = await getEntries(id);
  const e = entries[idx];
  if(!e) return;
  document.getElementById(id + '-title').value = e.title || '';
  document.getElementById(id + '-date').value = e.date || '';
  document.getElementById(id + '-value').value = e.value || '';
  document.getElementById(id + '-notes').value = e.notes || '';
  setEditMode(id, idx, 'Save changes');
  document.getElementById(id + '-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- entry CRUD: table rows ---------- */
async function addTableRow(id){
  const config = TABLE_LEAVES[id];
  const noteEl = document.getElementById(id + '-savenote');
  const row = {};
  let hasAny = false;
  config.columns.forEach(col => {
    if(col.type === 'computed') return;
    const val = document.getElementById(id + '-f-' + col.key).value.trim();
    row[col.key] = val;
    if(val) hasAny = true;
  });

  if(!hasAny){
    noteEl.textContent = "Fill in at least the client's name first.";
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], ...row };
  }else{
    row.ts = Date.now();
    entries.push(row);
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    config.columns.forEach(col => {
      document.getElementById(id + '-f-' + col.key).value = '';
    });
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add client');
  }else{
    noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.');
    noteEl.style.color = 'var(--red)';
  }
  renderList(id);
}

async function editTableRow(id, idx){
  const config = TABLE_LEAVES[id];
  const entries = await getEntries(id);
  const row = entries[idx];
  if(!row) return;
  config.columns.forEach(col => {
    if(col.type === 'computed') return;
    document.getElementById(id + '-f-' + col.key).value = row[col.key] || '';
  });
  setEditMode(id, idx, 'Save changes');
  document.getElementById(id + '-f-' + config.columns[0].key).scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function deleteEntry(id, idx){
  const entries = await getEntries(id);
  entries.splice(idx, 1);
  await saveEntries(id, entries);
  renderList(id);
}

async function clearEntries(id){
  if(!confirm('Remove all entries in this section? This cannot be undone.')) return;
  await saveEntries(id, []);
  renderList(id);
}

/* ---------- init ---------- */
async function seedIfEmpty(){
  for(const id in SEED_DATA){
    const existing = await getEntries(id);
    if(existing.length === 0){
      const seeded = SEED_DATA[id].map(row => ({ ...row, ts: Date.now() + Math.random() }));
      await saveEntries(id, seeded);
    }
  }
}

function renderTodayBadge(){
  const el = document.getElementById('today-badge');
  if(!el) return;
  const d = new Date();
  el.textContent = 'Today · ' + d.toLocaleDateString('en-US', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
}

window.initApp = async function initApp(){
  renderTodayBadge();
  renderGroupNav();
  renderBoxGrid();
  renderView();
  await primeCache();
  await seedIfEmpty();
  for(const g of GROUPS){
    for(const item of g.items){
      await renderList(item.id);
    }
  }
  await renderAllCounts();
  await renderRewardsPanel();
};
</script>
