<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benefits Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #16233B;
    --navy-soft: #1E304D;
    --ivory: #FBF9F5;
    --ink: #23262B;
    --ink-soft: #6B7280;
    --brass: #B8863F;
    --brass-soft: #E7D3AC;
    --line: #E4DFD3;
    --red: #B4483C;
    --stripe: #FAF3E3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:var(--ivory);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }
  .sidebar{
    width:210px;
    flex-shrink:0;
    background:var(--navy);
    color:#D9DCE3;
    padding:28px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:500;
    color:#fff;
    letter-spacing:0.2px;
    padding:0 4px 22px 4px;
  }
  .brand span{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:11px;
    color:#8C96A8;
    margin-top:2px;
    font-weight:400;
  }
  .nav-item{
    all:unset;
    cursor:pointer;
    padding:11px 12px;
    border-radius:7px;
    font-size:15px;
    color:#C6CCD9;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:background 0.15s ease, color 0.15s ease;
    gap:8px;
  }
  .nav-item:hover{
    background:var(--navy-soft);
    color:#fff;
  }
  .nav-item.active{
    background:var(--brass);
    color:#1B1300;
    font-weight:500;
  }
  .nav-item .count{
    font-size:11px;
    color:#7C87A0;
    background:rgba(255,255,255,0.06);
    padding:1px 7px;
    border-radius:100px;
    min-width:20px;
    text-align:center;
  }
  .nav-item.active .count{
    color:#5C4520;
    background:rgba(0,0,0,0.1);
  }

  main{
    flex:1;
    padding:40px 48px;
    max-width:980px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:26px;
    margin:0 0 4px 0;
  }
  .sub{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:28px;
  }

  /* --- big box grid --- */
  .box-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .box{
    all:unset;
    cursor:pointer;
    border:1px solid var(--line);
    background:#fff;
    border-radius:14px;
    padding:26px 24px;
    display:flex;
    flex-direction:column;
    gap:18px;
    transition:border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .box:hover{
    border-color:var(--brass);
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(22,35,59,0.08);
  }
  .box .box-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .box .box-count{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:500;
    color:var(--navy);
  }
  .box .box-count-label{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:-4px;
  }
  .box .box-label{
    font-size:16.5px;
    font-weight:600;
    color:var(--ink);
    line-height:1.3;
  }
  .box .box-arrow{
    font-size:18px;
    color:var(--brass);
  }

  /* --- leaf detail view --- */
  .leaf-view{ display:none; }
  .leaf-view.visible{
    display:block;
    animation:fade 0.2s ease;
  }
  .back-link{
    all:unset;
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:14px;
  }
  .back-link:hover{ color:var(--navy); }

  @keyframes fade{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:12px;
    background:#fff;
  }

  /* entry form (generic sections) */
  .entry-form{
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    background:#fff;
    margin-bottom:22px;
  }
  .entry-form .fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 12px;
    margin-bottom:10px;
  }
  .entry-form .fields .full{
    grid-column:1 / -1;
  }
  label{
    font-size:11.5px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
    font-weight:500;
  }
  input, textarea, select{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--ivory);
    color:var(--ink);
  }
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--brass-soft);
    outline-offset:0;
    border-color:var(--brass);
  }
  textarea{ resize:vertical; min-height:44px; }
  .form-actions{
    display:flex;
    justify-content:flex-end;
  }
  button.primary{
    all:unset;
    cursor:pointer;
    background:var(--navy);
    color:#fff;
    font-size:13px;
    font-weight:500;
    padding:9px 16px;
    border-radius:7px;
  }
  button.primary:hover{ background:var(--navy-soft); }

  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .list-head h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:15px;
    margin:0;
  }
  .clear-link{
    all:unset;
    cursor:pointer;
    font-size:12px;
    color:var(--red);
  }
  .clear-link:hover{ text-decoration:underline; }

  .entry{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding:2px 0;
  }
  .entry .info{ flex:1; }
  .entry .title-line{
    font-size:14px;
    font-weight:500;
    display:flex;
    gap:8px;
    align-items:baseline;
    flex-wrap:wrap;
  }
  .entry .date{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:400;
  }
  .entry .value{
    font-family:'Fraunces', serif;
    color:var(--navy);
    font-size:13.5px;
  }
  .entry .notes{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
    line-height:1.4;
  }
  .entry .del{
    all:unset;
    cursor:pointer;
    font-size:12px;
    color:var(--ink-soft);
    padding:3px 6px;
  }
  .entry .del:hover{ color:var(--red); }

  .empty{
    color:var(--ink-soft);
    font-size:13.5px;
    padding:6px 0;
  }
  .save-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:-6px;
    margin-bottom:18px;
    min-height:14px;
  }

  /* --- table-style sections (e.g. 2026 Clients) --- */
  .table-scroll{
    border:1px solid var(--line);
    border-radius:10px;
    overflow-x:auto;
    background:#fff;
    margin-bottom:8px;
  }
  table.data-table{
    border-collapse:collapse;
    width:100%;
    min-width:820px;
    font-size:13.5px;
  }
  table.data-table th{
    text-align:left;
    background:var(--navy);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:11px 12px;
    white-space:nowrap;
  }
  table.data-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  table.data-table tbody tr:nth-child(odd){ background:var(--stripe); }
  table.data-table tbody tr:hover{ background:var(--brass-soft); }
  table.data-table td.num{ font-family:'Fraunces', serif; color:var(--navy); }
  table.data-table tfoot td{
    font-weight:700;
    font-family:'Fraunces', serif;
    color:var(--navy);
    border-top:2px solid var(--navy);
    border-bottom:none;
    background:#fff;
  }
  table.data-table .row-del{
    all:unset;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:12px;
  }
  table.data-table .row-del:hover{ color:var(--red); }
  .status-pill{
    display:inline-block;
    font-size:11.5px;
    padding:2px 9px;
    border-radius:100px;
    font-weight:500;
  }
  .status-Issued{ background:#DCEEE0; color:#2A6B3D; }
  .status-Pending{ background:#F5E7C6; color:#8A6417; }
  .status-In\ Process{ background:#DCE6F5; color:#2A4E8A; }
  .status-Declined{ background:#F3D9D6; color:#A03A2F; }

  .table-form{
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    background:#fff;
    margin-bottom:16px;
  }
  .table-form .fields{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px 12px;
    margin-bottom:12px;
  }
  .table-form .fields .span2{ grid-column:span 2; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">Benefits<span>Employee dashboard</span></div>
  <div id="group-nav"></div>
</div>

<main>
  <h1 id="group-title">Pru</h1>
  <div class="sub" id="group-sub">Tap a section to open it.</div>

  <div class="box-grid" id="box-grid"></div>
  <div id="leaf-mount"></div>
</main>

<script>
/* ---------- config ---------- */
const GROUPS = [
  { id: "pru", label: "Pru", items: [
    { id: "pru-rewards", label: "2026 Rewards & Achievements" },
    { id: "pru-clients", label: "2026 Clients" },
    { id: "pru-leads", label: "Pru Leads" },
    { id: "prufin", label: "Prufin" },
  ]},
  { id: "hmo", label: "HMO", items: [
    { id: "hmo-clients", label: "2026 Clients" },
    { id: "hmo-leads", label: "HMO Leads" },
    { id: "hmo-commissions", label: "Commissions" },
  ]},
  { id: "money", label: "Money Matters", items: [
    { id: "money-income", label: "Sources of Income" },
    { id: "money-flow", label: "Monthly Flow" },
    { id: "money-ledger", label: "Ledger" },
  ]},
];

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const PLAN_OPTIONS = ["PAA+","Elite 15","Elite 10","Elite 7","Elite 5","Exact 5","Exact 10","Exact 15","PLFL 20","PLFL 15","PLFL 10","PLFL 5","PYT","PSI","PLI 5","PLI 10","PruMil","PIA","PruWealth"];

/* leaf ids that use the structured client table instead of the generic form */
const TABLE_LEAVES = {
  "pru-clients": {
    columns: [
      { key: "name",      label: "Client's Name", type: "text",   placeholder: "Last, First" },
      { key: "submitted", label: "Submitted",      type: "select", options: MONTHS },
      { key: "status",    label: "Status",         type: "select", options: ["Issued","Pending","In Process","Declined"] },
      { key: "plan",      label: "Plan",           type: "select", options: PLAN_OPTIONS },
      { key: "sa",        label: "SA",             type: "currency" },
      { key: "ape",       label: "APE",            type: "currency" },
    ],
    totalKeys: ["sa","ape"],
    legend: [
      ["SA", "Sum Assured"],
      ["APE", "Annualized Premium Equivalent"],
    ],
  },
};

const SEED_DATA = {
  "pru-clients": [
    { name: "Salva, Kairos (Jade's BB)", submitted: "January",  status: "Issued", plan: "PAA+",     sa: "2000000",  ape: "21252"   },
    { name: "Cangrejo, Jan Karlo",       submitted: "February", status: "Issued", plan: "Elite 15", sa: "3000000",  ape: "128400"  },
    { name: "Micutuan, Rary Mae",        submitted: "February", status: "Issued", plan: "PAA+",     sa: "3000000",  ape: "30000"   },
    { name: "Roca, Maria Paula",         submitted: "February", status: "Issued", plan: "PAA+",     sa: "2300000",  ape: "24000"   },
    { name: "Candido, Angelica",         submitted: "March",    status: "Issued", plan: "",          sa: "1500000",  ape: "61279.80"},
    { name: "Coronel, Nikko",            submitted: "April",    status: "Issued", plan: "",          sa: "1000000",  ape: "40981.10"},
    { name: "Nicart, Maikei",            submitted: "April",    status: "Issued", plan: "PAA+",     sa: "2200000",  ape: "24007.08"},
  ],
};

const editState = {}; // leaf id -> index currently being edited, or null

let activeGroup = GROUPS[0].id;
let activeLeaf = null; // null = showing box grid for the active group

/* ---------- storage helpers ---------- */
async function getEntries(id){
  try{
    const res = await window.storage.get(id, false);
    if(!res || !res.value) return [];
    return JSON.parse(res.value);
  }catch(e){
    return [];
  }
}
async function saveEntries(id, entries){
  try{
    const res = await window.storage.set(id, JSON.stringify(entries), false);
    return !!res;
  }catch(e){
    return false;
  }
}

/* ---------- sidebar (groups only) ---------- */
const groupNav = document.getElementById('group-nav');
function renderGroupNav(){
  groupNav.innerHTML = GROUPS.map(g => `
    <button class="nav-item ${g.id === activeGroup ? 'active' : ''}" onclick="selectGroup('${g.id}')">
      <span>${g.label}</span>
      <span class="count" id="gcount-${g.id}">0</span>
    </button>
  `).join('');
}

/* ---------- box grid ---------- */
const boxGrid = document.getElementById('box-grid');
const groupTitle = document.getElementById('group-title');
const groupSub = document.getElementById('group-sub');

function renderBoxGrid(){
  const group = GROUPS.find(g => g.id === activeGroup);
  groupTitle.textContent = group.label;
  groupSub.textContent = 'Tap a section to open it.';
  boxGrid.innerHTML = group.items.map(item => `
    <button class="box" onclick="selectLeaf('${group.id}','${item.id}')">
      <div class="box-top">
        <div>
          <div class="box-count" id="bcount-${item.id}">0</div>
          <div class="box-count-label">entries</div>
        </div>
        <div class="box-arrow">→</div>
      </div>
      <div class="box-label">${item.label}</div>
    </button>
  `).join('');
}

/* ---------- leaf detail panels ---------- */
const leafMount = document.getElementById('leaf-mount');

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
function parseCurrency(s){
  if(!s) return 0;
  const n = parseFloat(String(s).replace(/[₱,\s]/g, ''));
  return isNaN(n) ? 0 : n;
}
function fmtCurrency(n){
  return '₱' + (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* -- generic form panel builder -- */
function buildGenericPanel(item, groupLabel){
  const el = document.createElement('div');
  el.className = 'leaf-view';
  el.id = 'leaf-' + item.id;
  el.innerHTML = `
    <button class="back-link" onclick="backToGrid()">← ${groupLabel}</button>
    <h1>${item.label}</h1>
    <div class="sub">${groupLabel}</div>

    <div class="entry-form">
      <div class="fields">
        <div>
          <label for="${item.id}-title">Title</label>
          <input id="${item.id}-title" type="text" placeholder="e.g. name, item, description">
        </div>
        <div>
          <label for="${item.id}-date">Date</label>
          <input id="${item.id}-date" type="date">
        </div>
        <div>
          <label for="${item.id}-value">Amount / Value (optional)</label>
          <input id="${item.id}-value" type="text" placeholder="e.g. ₱5,000 or 3">
        </div>
        <div class="full">
          <label for="${item.id}-notes">Notes (optional)</label>
          <textarea id="${item.id}-notes" placeholder="Any details worth remembering"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="clear-link" id="${item.id}-cancel" style="display:none; margin-right:auto;" onclick="cancelEdit('${item.id}')">Cancel edit</button>
        <button class="primary" id="${item.id}-submit" onclick="addEntry('${item.id}')">Add entry</button>
      </div>
    </div>
    <div class="save-note" id="${item.id}-savenote"></div>

    <div class="list-head">
      <h3>Entries</h3>
      <button class="clear-link" onclick="clearEntries('${item.id}')">Clear all</button>
    </div>
    <div id="${item.id}-list"></div>
  `;
  return el;
}

/* -- structured table panel builder -- */
function buildTablePanel(item, groupLabel, config){
  const el = document.createElement('div');
  el.className = 'leaf-view';
  el.id = 'leaf-' + item.id;

  const fieldInputs = config.columns.map(col => {
    const wide = col.type === 'text' ? 'span2' : '';
    if(col.type === 'select'){
      return `
        <div class="${wide}">
          <label>${col.label}</label>
          <select id="${item.id}-f-${col.key}">
            <option value="">—</option>
            ${col.options.map(o => `<option value="${o}">${o}</option>`).join('')}
          </select>
        </div>`;
    }
    if(col.type === 'currency'){
      return `
        <div>
          <label>${col.label}</label>
          <input id="${item.id}-f-${col.key}" type="text" placeholder="0.00">
        </div>`;
    }
    return `
      <div class="${wide}">
        <label>${col.label}</label>
        <input id="${item.id}-f-${col.key}" type="text" placeholder="${col.placeholder || ''}">
      </div>`;
  }).join('');

  const legendHtml = config.legend ? `
    <div class="sub" style="margin-top:-18px; margin-bottom:22px;">
      ${config.legend.map(([abbr, full]) => `<strong>${abbr}</strong> = ${full}`).join(' &nbsp;·&nbsp; ')}
    </div>` : '';

  el.innerHTML = `
    <button class="back-link" onclick="backToGrid()">← ${groupLabel}</button>
    <h1>${item.label}</h1>
    <div class="sub">${groupLabel}</div>
    ${legendHtml}

    <div class="table-form">
      <div class="fields">${fieldInputs}</div>
      <div class="form-actions">
        <button class="clear-link" id="${item.id}-cancel" style="display:none; margin-right:auto;" onclick="cancelEdit('${item.id}')">Cancel edit</button>
        <button class="primary" id="${item.id}-submit" onclick="addTableRow('${item.id}')">Add client</button>
      </div>
    </div>
    <div class="save-note" id="${item.id}-savenote"></div>

    <div class="list-head">
      <h3>Entries</h3>
      <button class="clear-link" onclick="clearEntries('${item.id}')">Clear all</button>
    </div>
    <div id="${item.id}-list"></div>
  `;
  return el;
}

GROUPS.forEach(g => {
  g.items.forEach(item => {
    const tableConfig = TABLE_LEAVES[item.id];
    const panel = tableConfig ? buildTablePanel(item, g.label, tableConfig) : buildGenericPanel(item, g.label);
    leafMount.appendChild(panel);
  });
});

/* ---------- view switching ---------- */
function renderView(){
  const showGrid = activeLeaf === null;
  boxGrid.style.display = showGrid ? 'grid' : 'none';
  document.getElementById('group-title').style.display = showGrid ? 'block' : 'none';
  document.getElementById('group-sub').style.display = showGrid ? 'block' : 'none';
  document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
  if(!showGrid){
    document.getElementById('leaf-' + activeLeaf).classList.add('visible');
  }
}

function selectGroup(groupId){
  activeGroup = groupId;
  activeLeaf = null;
  renderGroupNav();
  renderBoxGrid();
  renderView();
}

function selectLeaf(groupId, leafId){
  activeGroup = groupId;
  activeLeaf = leafId;
  renderGroupNav();
  renderView();
}

function backToGrid(){
  activeLeaf = null;
  renderBoxGrid();
  renderView();
}

/* ---------- rendering: generic list ---------- */
async function renderList(id){
  if(TABLE_LEAVES[id]){
    return renderTable(id);
  }
  const entries = await getEntries(id);
  const listEl = document.getElementById(id + '-list');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;

  if(entries.length === 0){
    listEl.innerHTML = `<div class="empty">No entries yet — add your first one above.</div>`;
  }else{
    const sorted = [...entries].sort((a,b) => (b.ts||0) - (a.ts||0));
    listEl.innerHTML = sorted.map(e => {
      const idx = entries.indexOf(e);
      return `
      <div class="card entry">
        <div class="info">
          <div class="title-line">
            ${e.title ? escapeHtml(e.title) : '<span style="color:var(--ink-soft)">Untitled</span>'}
            ${e.date ? `<span class="date">${fmtDate(e.date)}</span>` : ''}
          </div>
          ${e.value ? `<div class="value">${escapeHtml(e.value)}</div>` : ''}
          ${e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <div style="display:flex; gap:4px; flex-shrink:0;">
          <button class="del" onclick="editEntry('${id}', ${idx})">Edit</button>
          <button class="del" onclick="deleteEntry('${id}', ${idx})">Remove</button>
        </div>
      </div>`;
    }).join('');
  }
  await renderGroupCount(idToGroup(id));
}

/* ---------- rendering: structured table ---------- */
async function renderTable(id){
  const config = TABLE_LEAVES[id];
  const entries = await getEntries(id);
  const listEl = document.getElementById(id + '-list');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;

  if(entries.length === 0){
    listEl.innerHTML = `<div class="empty">No entries yet — add your first client above.</div>`;
    await renderGroupCount(idToGroup(id));
    return;
  }

  const sorted = [...entries].sort((a,b) => (a.ts||0) - (b.ts||0));

  const headCells = config.columns.map(c => `<th>${c.label}</th>`).join('') + '<th></th>';
  const bodyRows = sorted.map(row => {
    const idx = entries.indexOf(row);
    const cells = config.columns.map(c => {
      const v = row[c.key];
      if(c.type === 'currency'){
        return `<td class="num">${fmtCurrency(parseCurrency(v))}</td>`;
      }
      if(c.key === 'status' && v){
        return `<td><span class="status-pill status-${v.replace(' ','\\ ')}">${escapeHtml(v)}</span></td>`;
      }
      return `<td>${escapeHtml(v || '')}</td>`;
    }).join('');
    return `<tr>${cells}<td><button class="row-del" onclick="editTableRow('${id}', ${idx})">Edit</button>&nbsp;&nbsp;<button class="row-del" onclick="deleteEntry('${id}', ${idx})">Remove</button></td></tr>`;
  }).join('');

  const totals = {};
  config.totalKeys.forEach(k => totals[k] = 0);
  entries.forEach(row => {
    config.totalKeys.forEach(k => totals[k] += parseCurrency(row[k]));
  });
  const totalLabelSpan = config.columns.length - config.totalKeys.length;
  const totalCells = config.columns.map((c, i) => {
    if(config.totalKeys.includes(c.key)){
      return `<td>${fmtCurrency(totals[c.key])}</td>`;
    }
    return i === 0 ? `<td colspan="${totalLabelSpan}">Total</td>` : '';
  }).filter(x => x !== '').join('') + '<td></td>';

  listEl.innerHTML = `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
        <tfoot><tr>${totalCells}</tr></tfoot>
      </table>
    </div>
  `;
  await renderGroupCount(idToGroup(id));
}

function idToGroup(leafId){
  const g = GROUPS.find(g => g.items.some(i => i.id === leafId));
  return g ? g.id : null;
}

async function renderGroupCount(groupId){
  if(!groupId) return;
  const group = GROUPS.find(g => g.id === groupId);
  let total = 0;
  for(const item of group.items){
    const entries = await getEntries(item.id);
    total += entries.length;
  }
  const el = document.getElementById('gcount-' + groupId);
  if(el) el.textContent = total;
}

async function renderAllCounts(){
  for(const g of GROUPS){
    for(const item of g.items){
      const entries = await getEntries(item.id);
      const bcount = document.getElementById('bcount-' + item.id);
      if(bcount) bcount.textContent = entries.length;
    }
    await renderGroupCount(g.id);
  }
}

/* ---------- edit-mode helpers ---------- */
function setEditMode(id, idx, label){
  editState[id] = idx;
  const btn = document.getElementById(id + '-submit');
  const cancel = document.getElementById(id + '-cancel');
  if(btn) btn.textContent = label;
  if(cancel) cancel.style.display = 'inline';
}
function clearEditMode(id, label){
  editState[id] = null;
  const btn = document.getElementById(id + '-submit');
  const cancel = document.getElementById(id + '-cancel');
  if(btn) btn.textContent = label;
  if(cancel) cancel.style.display = 'none';
}
function cancelEdit(id){
  if(TABLE_LEAVES[id]){
    const config = TABLE_LEAVES[id];
    config.columns.forEach(col => { document.getElementById(id + '-f-' + col.key).value = ''; });
    clearEditMode(id, 'Add client');
  }else{
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-notes').value = '';
    clearEditMode(id, 'Add entry');
  }
  const noteEl = document.getElementById(id + '-savenote');
  if(noteEl) noteEl.textContent = '';
}

/* ---------- entry CRUD: generic ---------- */
async function addEntry(id){
  const title = document.getElementById(id + '-title').value.trim();
  const date = document.getElementById(id + '-date').value;
  const value = document.getElementById(id + '-value').value.trim();
  const notes = document.getElementById(id + '-notes').value.trim();
  const noteEl = document.getElementById(id + '-savenote');

  if(!title && !value && !notes){
    noteEl.textContent = 'Add at least a title, value, or note first.';
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], title, date, value, notes };
  }else{
    entries.push({ title, date, value, notes, ts: Date.now() });
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-notes').value = '';
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add entry');
  }else{
    noteEl.textContent = 'Could not save — please try again.';
    noteEl.style.color = 'var(--red)';
  }
  renderList(id);
}

async function editEntry(id, idx){
  const entries = await getEntries(id);
  const e = entries[idx];
  if(!e) return;
  document.getElementById(id + '-title').value = e.title || '';
  document.getElementById(id + '-date').value = e.date || '';
  document.getElementById(id + '-value').value = e.value || '';
  document.getElementById(id + '-notes').value = e.notes || '';
  setEditMode(id, idx, 'Save changes');
  document.getElementById(id + '-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- entry CRUD: table rows ---------- */
async function addTableRow(id){
  const config = TABLE_LEAVES[id];
  const noteEl = document.getElementById(id + '-savenote');
  const row = {};
  let hasAny = false;
  config.columns.forEach(col => {
    const val = document.getElementById(id + '-f-' + col.key).value.trim();
    row[col.key] = val;
    if(val) hasAny = true;
  });

  if(!hasAny){
    noteEl.textContent = "Fill in at least the client's name first.";
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], ...row };
  }else{
    row.ts = Date.now();
    entries.push(row);
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    config.columns.forEach(col => {
      document.getElementById(id + '-f-' + col.key).value = '';
    });
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add client');
  }else{
    noteEl.textContent = 'Could not save — please try again.';
    noteEl.style.color = 'var(--red)';
  }
  renderList(id);
}

async function editTableRow(id, idx){
  const config = TABLE_LEAVES[id];
  const entries = await getEntries(id);
  const row = entries[idx];
  if(!row) return;
  config.columns.forEach(col => {
    document.getElementById(id + '-f-' + col.key).value = row[col.key] || '';
  });
  setEditMode(id, idx, 'Save changes');
  document.getElementById(id + '-f-' + config.columns[0].key).scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function deleteEntry(id, idx){
  const entries = await getEntries(id);
  entries.splice(idx, 1);
  await saveEntries(id, entries);
  renderList(id);
}

async function clearEntries(id){
  if(!confirm('Remove all entries in this section? This cannot be undone.')) return;
  await saveEntries(id, []);
  renderList(id);
}

/* ---------- init ---------- */
async function seedIfEmpty(){
  for(const id in SEED_DATA){
    const existing = await getEntries(id);
    if(existing.length === 0){
      const seeded = SEED_DATA[id].map(row => ({ ...row, ts: Date.now() + Math.random() }));
      await saveEntries(id, seeded);
    }
  }
}

(async function init(){
  renderGroupNav();
  renderBoxGrid();
  renderView();
  await seedIfEmpty();
  for(const g of GROUPS){
    for(const item of g.items){
      await renderList(item.id);
    }
  }
  await renderAllCounts();
})();
</script>
